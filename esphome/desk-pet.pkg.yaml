    # Added because the pet was cute and inert — Skylar, on first hatch: "there
    # really isn't much to do with it". Feed has a 4 h cooldown and Train only
    # acts on a level-up, so between those two events there was nothing.
    #
    # The whole round runs on the ESP32. HA hears about it once, at the end.
    - id: page_pet_play
      on_load:
        - script.execute:
            id: nav_select
            idx: 0
        - script.execute: pet_game_start
      on_unload:
        - lambda: 'id(pet_game_active) = false;'
