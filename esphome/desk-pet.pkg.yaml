  # ── MEMORY ───────────────────────────────────────────────────────────
  # Eight pairs, face down. Flip two; matches stay up. Untimed.
  # A non-matching pair stays visible until the NEXT tap rather than
  # flipping back on a timer — a timer that hides the cards while you are
  # being asked a question on the call is exactly the wrong behaviour.
  - id: mem_paint
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *cb[16] = {id(mem_0), id(mem_1), id(mem_2), id(mem_3), id(mem_4), id(mem_5), id(mem_6), id(mem_7), id(mem_8), id(mem_9), id(mem_10), id(mem_11), id(mem_12), id(mem_13), id(mem_14), id(mem_15)};
          lv_obj_t *cl[16] = {id(lbl_mem_0), id(lbl_mem_1), id(lbl_mem_2), id(lbl_mem_3), id(lbl_mem_4), id(lbl_mem_5), id(lbl_mem_6), id(lbl_mem_7), id(lbl_mem_8), id(lbl_mem_9), id(lbl_mem_10), id(lbl_mem_11), id(lbl_mem_12), id(lbl_mem_13), id(lbl_mem_14), id(lbl_mem_15)};
          for (int i = 0; i < 16; i++) {
            const int st = id(mem_up)[i];
            lv_color_t bg = (st == 2) ? lv_color_hex(0x1E2228)
                          : (st == 1) ? lv_color_hex(0xE8EAED)
                                      : lv_color_hex(0x2A2F37);
            lv_obj_set_style_bg_color(cb[i], bg, LV_PART_MAIN);
            if (st == 0) { lv_label_set_text(cl[i], ""); }
            else {
              static char buf[16][3];
              snprintf(buf[i], 3, "%d", id(mem_face)[i]);
              lv_label_set_text(cl[i], buf[i]);
              lv_obj_set_style_text_color(cl[i],
                (st == 2) ? lv_color_hex(0x35C759) : lv_color_hex(0x14161A),
                LV_PART_MAIN);
            }
          }
      - lvgl.label.update:
          id: lbl_mem_status
          text: !lambda |-
            if (!id(mem_live) && id(mem_pairs) == 0) return std::string("tap New to deal");
            if (id(mem_pairs) >= 8)
              return std::string("all found in ") + std::to_string(id(mem_moves)) + " flips!";
            return std::to_string(id(mem_pairs)) + " / 8 pairs    " +
                   std::to_string(id(mem_moves)) + " flips";
          text_color: !lambda |-
            return id(mem_pairs) >= 8 ? lv_color_hex(0x35C759) : lv_color_hex(0x9AA0A6);

  - id: mem_new
    mode: restart
    then:
      - lambda: |-
          for (int i = 0; i < 16; i++) { id(mem_face)[i] = (i / 2) + 1; id(mem_up)[i] = 0; }
          // Fisher-Yates. A 'shuffle' by random swaps of random indices
          // is not uniform and tends to leave pairs adjacent.
          for (int i = 15; i > 0; i--) {
            const int j = esphome::random_uint32() % (i + 1);
            const int t = id(mem_face)[i]; id(mem_face)[i] = id(mem_face)[j]; id(mem_face)[j] = t;
          }
          id(mem_a) = -1; id(mem_b) = -1;
          id(mem_pairs) = 0; id(mem_moves) = 0;
          id(mem_live) = true;
      - script.execute: mem_paint

  - id: mem_tap
    mode: single
    parameters:
      card: int
    then:
      - lambda: |-
          if (!id(mem_live)) return;
          // A previous non-matching pair is cleared by THIS tap, not by a
          // timer — see the note above.
          if (id(mem_a) >= 0 && id(mem_b) >= 0) {
            id(mem_up)[id(mem_a)] = 0;
            id(mem_up)[id(mem_b)] = 0;
            id(mem_a) = -1; id(mem_b) = -1;
          }
          if (id(mem_up)[card] != 0) return;   // already up or matched
          id(mem_up)[card] = 1;
          id(mem_moves) = id(mem_moves) + 1;
          if (id(mem_a) < 0) { id(mem_a) = card; return; }
          if (id(mem_face)[card] == id(mem_face)[id(mem_a)]) {
            id(mem_up)[card] = 2;
            id(mem_up)[id(mem_a)] = 2;
            id(mem_a) = -1;
            id(mem_pairs) = id(mem_pairs) + 1;
          } else {
            id(mem_b) = card;
          }
      - script.execute: mem_paint
      - if:
          condition:
            lambda: 'return id(mem_live) && id(mem_pairs) >= 8;'
          then:
            - lambda: 'id(mem_live) = false;'
            - homeassistant.action:
                action: script.indicator_pet_played
                data_template:
                  score: "{{ sc }}"
                  game: "{{ gm }}"
                variables:
                  # Fewer flips is a better game: 16 is perfect, and the
                  # award tapers rather than dropping off a cliff.
                  sc: !lambda |-
                    int s = 34 - id(mem_moves);
                    if (s < 8) s = 8;
                    if (s > 24) s = 24;
                    return s;
                  gm: !lambda 'return 6;'
  - id: mem_tap_0
    then: [{script.execute: {id: mem_tap, card: 0}}]
  - id: mem_tap_1
    then: [{script.execute: {id: mem_tap, card: 1}}]
  - id: mem_tap_2
    then: [{script.execute: {id: mem_tap, card: 2}}]
  - id: mem_tap_3
    then: [{script.execute: {id: mem_tap, card: 3}}]
  - id: mem_tap_4
    then: [{script.execute: {id: mem_tap, card: 4}}]
  - id: mem_tap_5
    then: [{script.execute: {id: mem_tap, card: 5}}]
  - id: mem_tap_6
    then: [{script.execute: {id: mem_tap, card: 6}}]
  - id: mem_tap_7
    then: [{script.execute: {id: mem_tap, card: 7}}]
  - id: mem_tap_8
    then: [{script.execute: {id: mem_tap, card: 8}}]
  - id: mem_tap_9
    then: [{script.execute: {id: mem_tap, card: 9}}]
  - id: mem_tap_10
    then: [{script.execute: {id: mem_tap, card: 10}}]
  - id: mem_tap_11
    then: [{script.execute: {id: mem_tap, card: 11}}]
  - id: mem_tap_12
    then: [{script.execute: {id: mem_tap, card: 12}}]
  - id: mem_tap_13
    then: [{script.execute: {id: mem_tap, card: 13}}]
  - id: mem_tap_14
    then: [{script.execute: {id: mem_tap, card: 14}}]
  - id: mem_tap_15
    then: [{script.execute: {id: mem_tap, card: 15}}]
  # <<< PUZZLE-GEN scripts
  # >>> SUDOKU-GEN scripts
  # ── SUDOKU ───────────────────────────────────────────────────────────
  # Untimed, like the other puzzles, and the grid lives in HA so a
  # half-finished board survives a reflash — which on this panel happens
  # weekly, not yearly.
  - id: sud_load
    mode: restart
    then:
      - lambda: |-
          auto grab = [](text_sensor::TextSensor *s, int *dst) -> bool {
            if (!s->has_state()) return false;
            const std::string v = s->state;
            if (v.size() < 81) return false;
            for (int i = 0; i < 81; i++)
              dst[i] = (v[i] >= '1' && v[i] <= '9') ? (v[i] - '0') : 0;
            return true;
          };
          if (!grab(id(ha_sud_puzzle), id(sud_given))) return;
          grab(id(ha_sud_solution), id(sud_sol));
          // Progress may be empty or stale from another puzzle. Fall back
          // to the givens rather than showing someone else's answers.
          if (!grab(id(ha_sud_state), id(sud_cur)))
            for (int i = 0; i < 81; i++) id(sud_cur)[i] = id(sud_given)[i];
          for (int i = 0; i < 81; i++)
            if (id(sud_given)[i] != 0 && id(sud_cur)[i] != id(sud_given)[i])
              { for (int k = 0; k < 81; k++) id(sud_cur)[k] = id(sud_given)[k]; break; }
          id(sud_sel) = -1;
          id(sud_done) = false;
          id(sud_loaded) = true;
      - script.execute: sud_paint

  - id: sud_paint
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *cb[81] = {id(sud_0), id(sud_1), id(sud_2), id(sud_3), id(sud_4), id(sud_5), id(sud_6), id(sud_7), id(sud_8), id(sud_9), id(sud_10), id(sud_11), id(sud_12), id(sud_13), id(sud_14), id(sud_15), id(sud_16), id(sud_17), id(sud_18), id(sud_19), id(sud_20), id(sud_21), id(sud_22), id(sud_23), id(sud_24), id(sud_25), id(sud_26), id(sud_27), id(sud_28), id(sud_29), id(sud_30), id(sud_31), id(sud_32), id(sud_33), id(sud_34), id(sud_35), id(sud_36), id(sud_37), id(sud_38), id(sud_39), id(sud_40), id(sud_41), id(sud_42), id(sud_43), id(sud_44), id(sud_45), id(sud_46), id(sud_47), id(sud_48), id(sud_49), id(sud_50), id(sud_51), id(sud_52), id(sud_53), id(sud_54), id(sud_55), id(sud_56), id(sud_57), id(sud_58), id(sud_59), id(sud_60), id(sud_61), id(sud_62), id(sud_63), id(sud_64), id(sud_65), id(sud_66), id(sud_67), id(sud_68), id(sud_69), id(sud_70), id(sud_71), id(sud_72), id(sud_73), id(sud_74), id(sud_75), id(sud_76), id(sud_77), id(sud_78), id(sud_79), id(sud_80)};
          lv_obj_t *cl[81] = {id(lbl_sud_0), id(lbl_sud_1), id(lbl_sud_2), id(lbl_sud_3), id(lbl_sud_4), id(lbl_sud_5), id(lbl_sud_6), id(lbl_sud_7), id(lbl_sud_8), id(lbl_sud_9), id(lbl_sud_10), id(lbl_sud_11), id(lbl_sud_12), id(lbl_sud_13), id(lbl_sud_14), id(lbl_sud_15), id(lbl_sud_16), id(lbl_sud_17), id(lbl_sud_18), id(lbl_sud_19), id(lbl_sud_20), id(lbl_sud_21), id(lbl_sud_22), id(lbl_sud_23), id(lbl_sud_24), id(lbl_sud_25), id(lbl_sud_26), id(lbl_sud_27), id(lbl_sud_28), id(lbl_sud_29), id(lbl_sud_30), id(lbl_sud_31), id(lbl_sud_32), id(lbl_sud_33), id(lbl_sud_34), id(lbl_sud_35), id(lbl_sud_36), id(lbl_sud_37), id(lbl_sud_38), id(lbl_sud_39), id(lbl_sud_40), id(lbl_sud_41), id(lbl_sud_42), id(lbl_sud_43), id(lbl_sud_44), id(lbl_sud_45), id(lbl_sud_46), id(lbl_sud_47), id(lbl_sud_48), id(lbl_sud_49), id(lbl_sud_50), id(lbl_sud_51), id(lbl_sud_52), id(lbl_sud_53), id(lbl_sud_54), id(lbl_sud_55), id(lbl_sud_56), id(lbl_sud_57), id(lbl_sud_58), id(lbl_sud_59), id(lbl_sud_60), id(lbl_sud_61), id(lbl_sud_62), id(lbl_sud_63), id(lbl_sud_64), id(lbl_sud_65), id(lbl_sud_66), id(lbl_sud_67), id(lbl_sud_68), id(lbl_sud_69), id(lbl_sud_70), id(lbl_sud_71), id(lbl_sud_72), id(lbl_sud_73), id(lbl_sud_74), id(lbl_sud_75), id(lbl_sud_76), id(lbl_sud_77), id(lbl_sud_78), id(lbl_sud_79), id(lbl_sud_80)};
          static char buf[81][2];
          for (int i = 0; i < 81; i++) {
            const int v = id(sud_cur)[i];
            const bool given = id(sud_given)[i] != 0;
            // Conflict = same value already in this row, column or box.
            // Shown live rather than only at the end: this is a game for
            // sitting on a call, not an exam.
            bool bad = false;
            if (v != 0) {
              const int r = i / 9, c = i % 9;
              const int br = (r / 3) * 3, bc = (c / 3) * 3;
              for (int k = 0; k < 9 && !bad; k++) {
                const int a = r * 9 + k, b = k * 9 + c;
                const int d = (br + k / 3) * 9 + bc + k % 3;
                if (a != i && id(sud_cur)[a] == v) bad = true;
                if (b != i && id(sud_cur)[b] == v) bad = true;
                if (d != i && id(sud_cur)[d] == v) bad = true;
              }
            }
            // ONE label per cell whose FONT changes: montserrat_18 for a
            // real digit, montserrat_10 for a 3x3 block of pencil marks.
            // Two stacked labels would be 81 more LVGL objects for no gain,
            // and RAM is the resource this page actually spends.
            if (v != 0) {
              buf[i][0] = '0' + v; buf[i][1] = 0;
              lv_obj_set_style_text_font(cl[i], &lv_font_montserrat_18, LV_PART_MAIN);
              lv_obj_set_style_text_line_space(cl[i], 0, LV_PART_MAIN);
              lv_label_set_text(cl[i], buf[i]);
              lv_obj_set_style_text_color(cl[i],
                bad   ? lv_color_hex(0xE5484D) :
                given ? lv_color_hex(0xE8EAED)
                      : lv_color_hex(0xF2B01E), LV_PART_MAIN);
            } else if (id(sud_marks)[i] != 0) {
              // Classic 3x3 candidate grid: every digit keeps its own slot,
              // so the SHAPE of the marks is readable without reading them.
              static char pm[81][16];
