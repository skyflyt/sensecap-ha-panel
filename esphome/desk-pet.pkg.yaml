              - if:
                  condition:
                    lambda: 'return id(pet_game_active);'
                  then:
                    - lambda: 'id(pet_game_score) = id(pet_game_score) + 1;'
                    - lvgl.label.update:
                        id: lbl_game_score
                        text: !lambda 'return std::to_string(id(pet_game_score));'
                    - script.execute: pet_hop
