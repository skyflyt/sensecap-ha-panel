    # <<< SUDOKU-GEN page
    # ── POWERS (2026-08-25) ──────────────────────────────────────────────────
    # Four rows, each stating either what it does or what it is waiting for.
    # Locked rows stay VISIBLE: seeing what is coming is most of the reason to
    # keep levelling, and a page that grows rows out of nowhere is worse than
    # one that fills in.
    #
    # Every power here is built from a HASS.Agent command that already exists
    # and already works — the pet is a new way to reach things Skylar could
    # already do, never a new capability.
    - id: page_pet_powers
      on_load:
        - script.execute:
            id: nav_select
            idx: 0
        - script.execute: refresh_pet
      widgets:
        - label:
            align: TOP_MID
            y: 12
            text: "Powers"
            text_font: montserrat_20
            text_color: 0xE8EAED
        - button:
            styles: tile
            align: TOP_MID
            y: 46
            width: 424
            height: 74
            on_click:
              # A locked power must REFUSE, not merely look locked.
              # The row said 'locked - level 3' while the button ran
              # the power anyway, which is worse than no gate at all:
              # it teaches that the labels are decorative.
              - if:
                  condition:
                    lambda: |-
                      if (!id(ha_pet_state).has_state()) return false;
                      return indicator_state_int(id(ha_pet_state).state, "lvl", 1) >= 3;
                  then:
                    - lvgl.page.show: page_power
                    - script.execute:
                        id: pw_start
                        which: 1
            widgets:
              - label:
                  id: lbl_pw_t_tidy
                  align: TOP_LEFT
                  x: 4
                  text: "Tidy"
                  text_font: montserrat_18
                  text_color: 0xF2B01E
              - label:
                  id: lbl_pw_tidy
                  align: BOTTOM_LEFT
                  x: 4
                  text: ""
                  text_font: montserrat_14
                  text_color: 0x9AA0A6
        - button:
            styles: tile
            align: TOP_MID
            y: 128
            width: 424
            height: 74
            on_click:
              # A locked power must REFUSE, not merely look locked.
              # The row said 'locked - level 4' while the button ran
              # the power anyway, which is worse than no gate at all:
              # it teaches that the labels are decorative.
              - if:
                  condition:
                    lambda: |-
                      if (!id(ha_pet_state).has_state()) return false;
                      return indicator_state_int(id(ha_pet_state).state, "lvl", 1) >= 4;
                  then:
                    - lvgl.page.show: page_power
                    - script.execute:
                        id: pw_start
                        which: 2
            widgets:
              - label:
                  id: lbl_pw_t_den
                  align: TOP_LEFT
                  x: 4
                  text: "Den"
                  text_font: montserrat_18
                  text_color: 0xF2B01E
              - label:
                  id: lbl_pw_den
                  align: BOTTOM_LEFT
                  x: 4
                  text: ""
                  text_font: montserrat_14
                  text_color: 0x9AA0A6
        - button:
            styles: tile
            align: TOP_MID
            y: 210
            width: 424
            height: 74
            on_click:
              # A locked power must REFUSE, not merely look locked.
              # The row said 'locked - level 5' while the button ran
              # the power anyway, which is worse than no gate at all:
              # it teaches that the labels are decorative.
              - if:
                  condition:
                    lambda: |-
                      if (!id(ha_pet_state).has_state()) return false;
                      return indicator_state_int(id(ha_pet_state).state, "lvl", 1) >= 5;
                  then:
                    - lvgl.page.show: page_power
                    - script.execute:
                        id: pw_start
                        which: 3
            widgets:
              - label:
                  id: lbl_pw_t_doctor
                  align: TOP_LEFT
