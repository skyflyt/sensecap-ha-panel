    # >>> PUZZLE-GEN pages
    # ── PEG SOLITAIRE ────────────────────────────────────────────────────
    # Untimed. `on_load` deals ONLY if no game is in progress, so being
    # pulled away mid-board and coming back later keeps the position.
    # 'Bank' ends the round and pays out — needed because a peg game can
    # dead-end with no legal move and there is nothing to detect as a win.
    - id: page_peg
      on_load:
        - script.execute: {id: nav_select, idx: 0}
        - if:
