      - lvgl.label.update:
          id: lbl_sud_status
          text: !lambda |-
            if (!id(sud_loaded)) return std::string("loading...");
            int blank = 0;
            for (int i = 0; i < 81; i++) if (id(sud_cur)[i] == 0) blank++;
            if (blank == 0 && id(sud_done)) return std::string("solved!");
            std::string d = id(ha_sud_diff).has_state() ? id(ha_sud_diff).state
                                                        : std::string("");
            return d + "   " + std::to_string(blank) + " left";
          text_color: !lambda |-
            return id(sud_done) ? lv_color_hex(0x35C759) : lv_color_hex(0x9AA0A6);

  - id: sud_tap
    mode: single
    parameters:
      cell: int
    then:
      - lambda: |-
          if (!id(sud_loaded)) return;
          // Tapping a GIVEN highlights that digit rather than doing
          // nothing — a given is exactly the sort of cell you point at
          // when asking 'where are the other 4s'.
          if (id(sud_given)[cell] != 0) {
            const int v = id(sud_given)[cell];
            id(sud_sel) = -1;
            id(sud_hl) = (id(sud_hl) == v) ? 0 : v;
            return;
          }
          // Tapping the selected cell again deselects it.
          id(sud_sel) = (id(sud_sel) == cell) ? -1 : cell;
      - script.execute: sud_paint

  - id: sud_enter
    mode: single
    parameters:
      val: int
    then:
      - lambda: |-
          if (!id(sud_loaded)) return;
          // NO CELL SELECTED -> the keypad is a highlight switch, not an
          // entry pad. Tapping the same digit twice turns it off, and X
          // clears it. This is why deselecting has to be easy: it is how
          // you get INTO scan mode.
          if (id(sud_sel) < 0) {
            id(sud_hl) = (val == 0 || id(sud_hl) == val) ? 0 : val;
            return;
          }
          const int cell = id(sud_sel);
          if (id(sud_given)[cell] != 0) return;
          id(sud_show_errors) = false;
          // PENCIL MODE: the keypad toggles candidates instead of placing
          // a digit, and X clears every mark in the cell.
          if (id(sud_pencil)) {
            if (val == 0) id(sud_marks)[cell] = 0;
            else          id(sud_marks)[cell] ^= (1 << (val - 1));
            return;
          }
          id(sud_cur)[cell] = val;
          id(sud_marks)[cell] = 0;
          // Placing a digit retires that candidate from its row, column and
          // box. That bookkeeping IS the point of pencil marks, and doing
          // it by hand on a touchscreen is miserable.
          if (val != 0) {
            const int r = cell / 9, c = cell % 9;
            const int br = (r / 3) * 3, bc = (c / 3) * 3;
            const int bit = 1 << (val - 1);
            for (int k = 0; k < 9; k++) {
              id(sud_marks)[r * 9 + k] &= ~bit;
              id(sud_marks)[k * 9 + c] &= ~bit;
              id(sud_marks)[(br + k / 3) * 9 + bc + k % 3] &= ~bit;
            }
          }
          bool full = true;
          for (int i = 0; i < 81; i++) if (id(sud_cur)[i] == 0) { full = false; break; }
          bool right = full;
          if (full)
            for (int i = 0; i < 81; i++)
              if (id(sud_cur)[i] != id(sud_sol)[i]) { right = false; break; }
          id(sud_done) = right;
      - script.execute: sud_paint
      - if:
          condition:
            lambda: 'return id(sud_done);'
          then:
            - script.execute: sud_save
            # Difficulty-scaled, daily-aware, and OUTSIDE the games cap. A
            # daily cannot be farmed — three a day, each claimable once —
            # so making it compete with Catch for the same 40/day budget
            # would mean 30 minutes of Hard sudoku frequently paid nothing.
            - homeassistant.action:
                action: script.indicator_pet_sudoku_solved

  # Push the grid back to HA. Called on leaving the page and on solving,
  # NOT on every keypress: that would be one HA round trip per digit on a
  # panel whose whole design fights latency.
  - id: sud_save
    mode: single
    then:
      - homeassistant.action:
          action: input_text.set_value
          data_template:
            # One board per difficulty, so switching level does not throw
            # away the grid you were part-way through.
            entity_id: "input_text.pet_sudoku_state_{{ d }}"
            value: "{{ g }}"
          variables:
            g: !lambda |-
              std::string s;
              s.reserve(81);
              for (int i = 0; i < 81; i++) s += (char) ('0' + id(sud_cur)[i]);
              return s;
            d: !lambda |-
              if (!id(ha_sud_diff).has_state()) return std::string("e");
              const std::string v = id(ha_sud_diff).state;
              if (v == "Medium") return std::string("m");
              if (v == "Hard")   return std::string("h");
              return std::string("e");

  - id: sud_reload
    mode: restart
    then:
      - lambda: 'id(sud_loaded) = false; id(sud_show_errors) = false;'
      - delay: 900ms
      - script.execute: sud_load

  # Check: flag wrong entries for 4 s, then drop back. Timed rather than
  # sticky, so it stays a deliberate look rather than a permanent error
  # overlay you stop seeing.
  - id: sud_check
    mode: restart
    then:
      - lambda: 'id(sud_show_errors) = true;'
      - script.execute: sud_paint
      - delay: 4s
      - lambda: 'id(sud_show_errors) = false;'
      - script.execute: sud_paint

  - id: sud_pencil_toggle
    mode: single
    then:
      - lambda: 'id(sud_pencil) = !id(sud_pencil);'
      - lvgl.widget.update:
          id: sud_btn_pencil
          bg_color: !lambda |-
            return id(sud_pencil) ? lv_color_hex(0xF2B01E) : lv_color_hex(0x1E2228);
      - lvgl.label.update:
          id: lbl_sud_pencil
          text_color: !lambda |-
            return id(sud_pencil) ? lv_color_hex(0x14161A) : lv_color_hex(0x9AA0A6);

  # Dailies and badges, from the meta sensor.
  - id: sud_meta_paint
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_sud_daily
          text: !lambda |-
            const char NL = 10;
            if (!id(ha_sud_meta).has_state()) return std::string();
            const std::string m = id(ha_sud_meta).state;
            if (indicator_state_int(m, "dly", 0) != 1)
              return std::string("practice") + NL + "(no" + NL + "daily)";
            if (indicator_state_int(m, "dn", 0) == 1)
              return std::string("today") + NL + "DONE";
            return std::string("today") + NL + "+" +
                   std::to_string(indicator_state_int(m, "xp", 0)) + " xp";
          text_color: !lambda |-
            if (!id(ha_sud_meta).has_state()) return lv_color_hex(0x6B7280);
            return indicator_state_int(id(ha_sud_meta).state, "dn", 0) == 1
                     ? lv_color_hex(0x35C759) : lv_color_hex(0xF2B01E);
      - lvgl.label.update:
          id: lbl_sud_badges
          text: !lambda |-
            const char NL = 10;
            if (!id(ha_sud_meta).has_state()) return std::string();
            const std::string m = id(ha_sud_meta).state;
            return std::string("solved") + NL +
                   "E " + std::to_string(indicator_state_int(m, "se", 0)) + NL +
                   "M " + std::to_string(indicator_state_int(m, "sm", 0)) + NL +
                   "H " + std::to_string(indicator_state_int(m, "sh", 0));
      - lvgl.label.update:
          id: lbl_sud_level
          text: !lambda |-
            if (!id(ha_sud_diff).has_state()) return std::string();
            return id(ha_sud_diff).state;
