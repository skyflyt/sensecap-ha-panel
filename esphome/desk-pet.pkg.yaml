          data_template:
            score: "{{ sc }}"
            game: "{{ gm }}"
          variables:
            sc: !lambda 'return id(pet_game_score);'
            gm: !lambda 'return 4;'
      - lambda: 'id(peg_live) = false;'
      - script.execute: peg_paint
