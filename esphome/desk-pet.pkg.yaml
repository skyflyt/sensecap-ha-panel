    then: [{script.execute: {id: sud_tap, cell: 71}}]
  - id: sud_tap_72
    then: [{script.execute: {id: sud_tap, cell: 72}}]
  - id: sud_tap_73
    then: [{script.execute: {id: sud_tap, cell: 73}}]
  - id: sud_tap_74
    then: [{script.execute: {id: sud_tap, cell: 74}}]
  - id: sud_tap_75
    then: [{script.execute: {id: sud_tap, cell: 75}}]
  - id: sud_tap_76
    then: [{script.execute: {id: sud_tap, cell: 76}}]
  - id: sud_tap_77
    then: [{script.execute: {id: sud_tap, cell: 77}}]
  - id: sud_tap_78
    then: [{script.execute: {id: sud_tap, cell: 78}}]
  - id: sud_tap_79
    then: [{script.execute: {id: sud_tap, cell: 79}}]
  - id: sud_tap_80
    then: [{script.execute: {id: sud_tap, cell: 80}}]
  - id: sud_key_0
    then: [{script.execute: {id: sud_enter, val: 0}}]
  - id: sud_key_1
    then: [{script.execute: {id: sud_enter, val: 1}}]
  - id: sud_key_2
    then: [{script.execute: {id: sud_enter, val: 2}}]
  - id: sud_key_3
    then: [{script.execute: {id: sud_enter, val: 3}}]
  - id: sud_key_4
    then: [{script.execute: {id: sud_enter, val: 4}}]
  - id: sud_key_5
    then: [{script.execute: {id: sud_enter, val: 5}}]
  - id: sud_key_6
    then: [{script.execute: {id: sud_enter, val: 6}}]
  - id: sud_key_7
    then: [{script.execute: {id: sud_enter, val: 7}}]
  - id: sud_key_8
    then: [{script.execute: {id: sud_enter, val: 8}}]
  - id: sud_key_9
    then: [{script.execute: {id: sud_enter, val: 9}}]
  # <<< SUDOKU-GEN scripts
  # ── POWER THEATRE ───────────────────────────────────────────────────────────
  # Each power gets its OWN sequence, because "the pet did a thing" is only
  # satisfying if the thing looks like the thing. Eight shared dots, a sweep
  # line and the pet sprite are re-choreographed per power rather than each
  # power owning its own widgets — one set of props, four plays.
  #
  # 80 ms tick. Everything runs on the device; HA is called once, at the point
  # in the sequence where the real work should fire, so the animation is never
  # waiting on a round trip.
  - id: pw_reset_props
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *d[8] = {id(pw_dot0), id(pw_dot1), id(pw_dot2), id(pw_dot3),
                            id(pw_dot4), id(pw_dot5), id(pw_dot6), id(pw_dot7)};
          for (int i = 0; i < 8; i++) {
            lv_obj_clear_flag(d[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(d[i], lv_color_hex(0x4B5563), LV_PART_MAIN);
            lv_obj_set_y(d[i], 214);
          }
          lv_obj_add_flag(id(pw_line), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_x(id(pw_pet1), 30);
          lv_obj_set_x(id(pw_pet2), 30);
          lv_obj_set_y(id(pw_pet1), 140);
          lv_obj_set_y(id(pw_pet2), 140);
      - lvgl.widget.hide: btn_pw_done
      - lvgl.label.update:
          id: lbl_pw_result
          text: ""

  - id: pw_start
    mode: restart
    parameters:
      which: int
    then:
      - lambda: 'id(pw_which) = which; id(pw_step) = 0; id(pw_running) = true;'
      - script.execute: pw_reset_props
      - lvgl.label.update:
          id: lbl_pw_title
          text: !lambda |-
            switch (id(pw_which)) {
              case 1: return std::string("Tidy");
              case 2: return std::string("Den");
              case 3: return std::string("Doctor");
              case 4: return std::string("Fetch");
            }
            return std::string("");
      - lvgl.label.update:
          id: lbl_pw_sub
          text: !lambda |-
            switch (id(pw_which)) {
              case 1: return std::string("sweeping the inboxes");
              case 2: return std::string("settling in for deep work");
              case 3: return std::string("checking the panel");
              case 4: return std::string("finding what is shouting");
            }
            return std::string("");
      # Fire the real work one tick in, so the first frame is already on screen
      # when the HA call goes out.
      - delay: 120ms
      - if:
          condition:
            lambda: 'return id(pw_which) == 1;'
          then:
            - homeassistant.action:
                action: script.indicator_pet_tidy
      - if:
          condition:
            lambda: 'return id(pw_which) == 2;'
          then:
            - homeassistant.action:
                action: script.indicator_pet_den
      - if:
          condition:
            lambda: 'return id(pw_which) == 3;'
          then:
            - homeassistant.action:
                action: script.indicator_pet_doctor
      - if:
          condition:
            lambda: 'return id(pw_which) == 4;'
          then:
            - homeassistant.action:
                action: script.indicator_pet_fetch

  - id: pw_tick
    mode: single
    then:
      - lambda: |-
          if (!id(pw_running)) return;
          const int s = id(pw_step)++;
          lv_obj_t *d[8] = {id(pw_dot0), id(pw_dot1), id(pw_dot2), id(pw_dot3),
                            id(pw_dot4), id(pw_dot5), id(pw_dot6), id(pw_dot7)};
          lv_obj_t *pet = id(ha_pet_state).has_state() &&
                          indicator_state_int(id(ha_pet_state).state, "stg", 1) >= 2
                            ? id(pw_pet2) : id(pw_pet1);

          switch (id(pw_which)) {
            // ── TIDY: the pet sweeps left to right and the dust goes with it.
            case 1: {
              const int x = 30 + s * 6;
              lv_obj_set_x(pet, x);
              // A little bounce, so it reads as sweeping rather than sliding.
              lv_obj_set_y(pet, 140 + ((s / 2) % 2 ? -3 : 3));
              for (int i = 0; i < 8; i++)
                if (40 + i * 52 < x + 40) lv_obj_add_flag(d[i], LV_OBJ_FLAG_HIDDEN);
              if (s > 66) id(pw_running) = false;
              break;
            }
            // ── DEN: the lights go down and three things tick off.
            case 2: {
              lv_obj_set_style_bg_opa(id(pw_dim),
                (lv_opa_t) (s * 4 > 170 ? 170 : s * 4), LV_PART_MAIN);
              for (int i = 0; i < 8; i++)
                if (i > 2) lv_obj_add_flag(d[i], LV_OBJ_FLAG_HIDDEN);
              if (s > 12 && s <= 24) lv_obj_set_style_bg_color(d[0], lv_color_hex(0x35C759), LV_PART_MAIN);
              if (s > 24 && s <= 36) lv_obj_set_style_bg_color(d[1], lv_color_hex(0x35C759), LV_PART_MAIN);
              if (s > 36)            lv_obj_set_style_bg_color(d[2], lv_color_hex(0x35C759), LV_PART_MAIN);
              if (s > 50) id(pw_running) = false;
              break;
            }
            // ── DOCTOR: a scan line sweeps down and the checks light as it passes.
            case 3: {
              lv_obj_clear_flag(id(pw_line), LV_OBJ_FLAG_HIDDEN);
              const int y = 80 + s * 5;
              lv_obj_set_y(id(pw_line), y);
              for (int i = 0; i < 8; i++)
                if (y > 214) lv_obj_set_style_bg_color(d[i], lv_color_hex(0x35C759), LV_PART_MAIN);
              if (s > 52) { id(pw_running) = false; lv_obj_add_flag(id(pw_line), LV_OBJ_FLAG_HIDDEN); }
              break;
            }
            // ── FETCH: dash off, beat, dash back.
            case 4: {
              for (int i = 0; i < 8; i++) lv_obj_add_flag(d[i], LV_OBJ_FLAG_HIDDEN);
              int x;
              if (s < 20)      x = 190 + s * 14;            // away
              else if (s < 30) x = 470;                     // gone
              else             x = 470 - (s - 30) * 14;     // back
              if (x < 190) x = 190;
              lv_obj_set_x(pet, x);
              if (s > 50) id(pw_running) = false;
              break;
            }
          }
      - if:
          condition:
            lambda: 'return !id(pw_running) && id(pw_which) != 0;'
          then:
            - script.execute: pw_finish

  # The payoff: say what actually happened, using real numbers where the panel
  # has them. A result screen that says "done" is barely better than silence.
  - id: pw_finish
    mode: single
    then:
      - lambda: 'id(pw_which) = id(pw_which);'
      - lvgl.label.update:
          id: lbl_pw_sub
          text: "done"
          text_color: 0x35C759
      - lvgl.label.update:
          id: lbl_pw_result
          text: !lambda |-
            const char NL = 10;
            switch (id(pw_which)) {
              case 1: {
                std::string out = "mail swept";
                if (id(ha_outlook_state).has_state()) {
                  const std::string o = id(ha_outlook_state).state;
                  out = std::string("Outlook: ") +
                        std::to_string(indicator_state_int(o, "swept", 0)) + " read" + NL +
                        "unread now " + std::to_string(indicator_state_int(o, "unread", 0));
                }
                return out + NL + "Gmail sweep sent";
              }
              case 2:
                // The panel has no mic-state sensor, so this reports what Den
                // DOES, not what it found. The HA script only fires the mute
                // toggle when the mic is actually live — claiming "muted" here
                // would be a guess dressed as a result.
                return std::string("lights off") + NL +
                       "mic muted if it was live" + NL +
                       "media paused";
              case 3:
                return std::string("health check run on the PC") + NL +
                       "HASS.Agent + sensors rechecked";
              case 4: {
                // ha_claude_attention is a BINARY sensor (input_boolean); the
                // COUNT is ha_claude_attention_count, a numeric one. Using the
                // wrong one here is a compile error rather than a silent zero,
                // which is the good outcome.
                int cl = 0, vip = 0; bool call = false;
                if (id(ha_claude_attention_count).has_state())
                  cl = (int) id(ha_claude_attention_count).state;
                if (id(ha_outlook_state).has_state())
                  vip = indicator_state_int(id(ha_outlook_state).state, "vip", 0);
                if (id(ha_teams_state).has_state())
                  call = indicator_state_int(id(ha_teams_state).state, "call", 0) == 1;
                if (call)    return std::string("Teams call is live") + NL + "brought it to the front";
                if (cl >= 1) return std::string("Claude: ") + std::to_string(cl) +
                                    " waiting" + NL + "brought it to the front";
                if (vip > 0) return std::string("Outlook: ") + std::to_string(vip) +
                                    " VIP unread" + NL + "brought it to the front";
                return std::string("all quiet") + NL + "nothing needed you";
              }
            }
            return std::string("");
      - lvgl.widget.show: btn_pw_done
      - lambda: 'lv_obj_set_style_bg_opa(id(pw_dim), 0, LV_PART_MAIN);'

  # Drive the nav tab bar. Called from every page's on_load, so it stays correct
  # however the page changed — tab tap, physical side button, or page wrap.
  #
  # Label colours are set here rather than left to the checked style: a label
  # inside a container does not reliably inherit text colour from its parent's
  # style (see the dark-on-dark note in the README), and a nav bar that silently
  # loses its text is exactly the failure that already cost a day.

sensor:
  # ── Desk pet: panel-touch counter published to HA (2026-08-25) ─────────────
  # Monotonic since boot. HA awards XP on the DELTA, so the 60 s cadence costs
  # nothing and no touch is lost between publishes — it is a counter, not a
  # sample. Deliberately not faster: a per-touch push would add an HA round
  # trip to every tap on a panel whose whole design fights latency.
  # ⚠️ NAMED "Pet Panel Touches", not "Panel Touches", and the reason is worth
  # keeping: while testing the HA automation before this sensor existed, a fake
  # state was POSTed to `sensor.my_panel_touches` via the REST
  # API. That created a real registry entry, so when the device came up it
  # found the id taken and silently claimed
  # `sensor.my_panel_touches_2` instead — the automation watched
  # the squatted corpse and never fired. The `_2` suffix is sticky in the
  # entity registry, so a fresh name is the clean fix.
  # NEVER POST a fake state to an id a device will later own.
  - platform: template
    id: panel_touch_count
    name: "Pet Panel Touches"
    lambda: 'return (float) id(panel_touches);'
    update_interval: 60s
    accuracy_decimals: 0
    icon: mdi:gesture-tap

  # Both Claude signals are COUNTS of sessions, not booleans (2026-08-13).
  # `claudeworkstate` is how many sessions are running; `claudeattention` is how
  # many have unread output. A binary "Working" tile could not distinguish one
  # busy session from four, and it looked broken when a session hung in the
  # Running state with nothing actually happening.

  # Optional, same rule as the text sensors above: guarded by has_state().
  - platform: homeassistant
    id: ha_claude_attention_count
    entity_id: ${entity_agent_attention}

text_sensor:
  - platform: homeassistant
    id: ha_pet_state
    entity_id: sensor.indicator_pet
    on_value:
      - script.execute: refresh_pet
  - platform: homeassistant
    id: ha_pet_mood
    entity_id: sensor.indicator_pet_mood
    on_value:
      - script.execute: refresh_pet
  - platform: homeassistant
    id: ha_pet_name
    entity_id: input_text.pet_name
    on_value:
      - script.execute: refresh_pet
  # Game XP taken today, against the 40 cap. Shown on the games menu so the
  # ceiling is visible rather than a silent surprise when rewards stop.
  - platform: homeassistant
    id: ha_pet_games_today
    entity_id: input_number.pet_games_today
    on_value:
      - lvgl.label.update:
          id: lbl_games_cap
          text: !lambda |-
            if (!id(ha_pet_games_today).has_state()) return std::string("");
            int used = (int) atof(id(ha_pet_games_today).state.c_str());
            if (used >= 40)
              return std::string("daily game xp used - play for fun");
            return std::to_string(used) + " / 40 game xp today";
      - script.execute: refresh_pet
  # Panel-use XP today (cap 20) and work XP today — both feed the split line.
  - platform: homeassistant
    id: ha_pet_taps_today
    entity_id: input_number.pet_taps_today
    on_value:
      - script.execute: refresh_pet
  - platform: homeassistant
    id: ha_pet_work_today
    entity_id: input_number.pet_work_today
    on_value:
      - script.execute: refresh_pet
  # All the settings in one encoded string:
  # en=..;lk=..;mt=..;ic=..;mn=..;gl=..;cg=..;cp=..
  # Every dial is an HA entity, so it can be changed from the panel, a
  # dashboard, an automation or a voice command without a reflash.
  # ── Sudoku (2026-08-25) ─────────────────────────────────────────────────────
  # Puzzle, answer and saved progress, all 81-char strings from HA. The bank is
  # generated off-device (tools/gen-sudoku-bank.py) because producing a grid
  # with a unique solution is a backtracking search, and the panel has exactly
  # one core spare for LVGL.
  - platform: homeassistant
    id: ha_sud_puzzle
    entity_id: sensor.pet_sudoku_puzzle
    on_value:
      - script.execute: sud_load
  - platform: homeassistant
    id: ha_sud_solution
    entity_id: sensor.pet_sudoku_solution
  # The board for the CURRENT difficulty. A template sensor picks the right one
  # of three, so switching level mid-puzzle keeps each grid where it was rather
  # than sharing one slot between them.
  - platform: homeassistant
    id: ha_sud_state
    entity_id: sensor.pet_sudoku_board
  # Daily state and lifetime badges, key=value; encoded like everything else:
  #   dly=1 today's puzzles are live · dn=1 this level already claimed
  #   se/sm/sh lifetime solves · xp what finishing this level pays
  - platform: homeassistant
    id: ha_sud_meta
    entity_id: sensor.pet_sudoku_meta
    on_value:
      - script.execute: sud_meta_paint
  - platform: homeassistant
    id: ha_sud_diff
    entity_id: input_select.pet_sudoku_difficulty
    on_value:
      - script.execute: sud_paint
      - script.execute: sud_meta_paint
      - lvgl.label.update:
          id: lbl_menu_sud
          text: !lambda |-
            if (!id(ha_sud_diff).has_state()) return std::string("");
            std::string s = id(ha_sud_diff).state;
            if (id(ha_sud_index).has_state())
              s += "  #" + std::to_string(((int) atof(id(ha_sud_index).state.c_str())) + 1);
            return s;
  - platform: homeassistant
    id: ha_sud_index
    entity_id: input_number.pet_sudoku_index

  - platform: homeassistant
    id: ha_pet_settings
    entity_id: sensor.indicator_pet_settings
    on_value:
      - script.execute: refresh_pet
      - script.execute: refresh_pet_settings


  # ── OPTIONAL work/PC signals ───────────────────────────────────────────────
  # The pet's decay pause gates and the Fetch power read these. Every use is
  # guarded by `has_state()`, so if you leave the placeholders pointing at
  # entities that do not exist, the pet still works — it simply never pauses
  # decay for a meeting and Fetch has nothing to focus. Point them at whatever
  # your setup actually publishes, or delete the three blocks and the Fetch
  # power with them.
  - platform: homeassistant
    id: ha_teams_state
    entity_id: ${entity_meeting_state}
  - platform: homeassistant
    id: ha_outlook_state
    entity_id: ${entity_mail_state}
  - platform: homeassistant
    id: ha_monitor_power
    entity_id: ${entity_monitor_power}

