    # <<< PUZZLE-GEN pages
    # >>> SUDOKU-GEN page
    # ── SUDOKU ───────────────────────────────────────────────────────────
    # Grid 9x35 px with a 3 px gutter between blocks -> x80..401, y32..353.
    # Keypad 10 x 42 -> x16..463, y360..402. Nav bar y414, so 12 px clear.
    #
    # The board is held in HA (`input_text.pet_sudoku_state`), so it
    # survives a reflash. It is saved on leaving the page and on solving,
    # never per keypress.
    - id: page_sudoku
      on_load:
        - script.execute: {id: nav_select, idx: 0}
        - script.execute: sud_load
      on_unload:
        - script.execute: sud_save
      widgets:
        # Backdrop, DECLARED FIRST so every other widget sits on top of it
        # and keeps its own taps. Only the bare space around the board
        # reaches this, which is exactly what should clear the selection.
        # Deselecting is not a nicety here — it is how you enter the
        # digit-highlight scan mode.
        - button:
            id: sud_backdrop
            align: TOP_LEFT
            x: 0
            y: 0
            width: 480
            height: 414
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            on_click:
              - lambda: 'id(sud_sel) = -1;'
              - script.execute: sud_paint
        - label:
            align: TOP_MID
            x: -70
            y: 8
            text: "Sudoku"
            text_font: montserrat_16
            text_color: 0xE8EAED
        - label:
            id: lbl_sud_level
            align: TOP_MID
            x: 10
            y: 10
            text: ""
            text_font: montserrat_12
            text_color: 0xF2B01E
        - label:
            id: lbl_sud_status
