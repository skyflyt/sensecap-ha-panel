  # ── LIGHTS OUT ───────────────────────────────────────────────────────
  # Tapping a cell flips it and its four neighbours. Turn them all off.
  # Dealt by playing random taps from a solved board, so every deal is
  # guaranteed solvable — a random fill is not, and an unsolvable puzzle
  # is indistinguishable from being bad at it.
  - id: lo_paint
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *c[25] = {id(lo_0), id(lo_1), id(lo_2), id(lo_3), id(lo_4), id(lo_5), id(lo_6), id(lo_7), id(lo_8), id(lo_9), id(lo_10), id(lo_11), id(lo_12), id(lo_13), id(lo_14), id(lo_15), id(lo_16), id(lo_17), id(lo_18), id(lo_19), id(lo_20), id(lo_21), id(lo_22), id(lo_23), id(lo_24)};
          for (int i = 0; i < 25; i++)
            lv_obj_set_style_bg_color(c[i],
              id(lo_board)[i] ? lv_color_hex(0xF2B01E) : lv_color_hex(0x2A2F37),
              LV_PART_MAIN);
      - lvgl.label.update:
          id: lbl_lo_status
          text: !lambda |-
            if (!id(lo_live)) return std::string("tap New to deal");
            int on = 0;
            for (int i = 0; i < 25; i++) on += id(lo_board)[i];
            if (on == 0) return std::string("solved in ") + std::to_string(id(lo_moves)) + "!";
            return std::to_string(on) + " lit    " + std::to_string(id(lo_moves)) + " moves";
          text_color: !lambda |-
            int on = 0;
            for (int i = 0; i < 25; i++) on += id(lo_board)[i];
            return on == 0 ? lv_color_hex(0x35C759) : lv_color_hex(0x9AA0A6);

  - id: lo_new
    mode: restart
    then:
      - lambda: |-
          for (int i = 0; i < 25; i++) id(lo_board)[i] = 0;
          for (int n = 0; n < 8; n++) {
            const int p = esphome::random_uint32() % 25;
            const int r = p / 5, c = p % 5;
            id(lo_board)[p] ^= 1;
            if (r > 0) id(lo_board)[p - 5] ^= 1;
            if (r < 4) id(lo_board)[p + 5] ^= 1;
            if (c > 0) id(lo_board)[p - 1] ^= 1;
            if (c < 4) id(lo_board)[p + 1] ^= 1;
          }
          id(lo_moves) = 0;
          id(lo_live) = true;
      - script.execute: lo_paint

  - id: lo_tap
    mode: single
    parameters:
      cell: int
    then:
      - lambda: |-
          if (!id(lo_live)) return;
          const int r = cell / 5, c = cell % 5;
          id(lo_board)[cell] ^= 1;
          if (r > 0) id(lo_board)[cell - 5] ^= 1;
          if (r < 4) id(lo_board)[cell + 5] ^= 1;
          if (c > 0) id(lo_board)[cell - 1] ^= 1;
          if (c < 4) id(lo_board)[cell + 1] ^= 1;
          id(lo_moves) = id(lo_moves) + 1;
      - script.execute: lo_paint
      - lambda: |-
          int on = 0;
          for (int i = 0; i < 25; i++) on += id(lo_board)[i];
          if (on == 0 && id(lo_live)) { id(lo_live) = false; id(pet_game_score) = 24; }
