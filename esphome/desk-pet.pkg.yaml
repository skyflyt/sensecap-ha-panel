              for (int d = 1; d <= 9; d++) {
                pm[i][n++] = (id(sud_marks)[i] & (1 << (d - 1))) ? ('0' + d) : ' ';
                if (d % 3 == 0 && d != 9) pm[i][n++] = (char) 10;
              }
              pm[i][n] = 0;
              lv_obj_set_style_text_font(cl[i], &lv_font_montserrat_10, LV_PART_MAIN);
              lv_obj_set_style_text_line_space(cl[i], -2, LV_PART_MAIN);
              lv_label_set_text(cl[i], pm[i]);
              lv_obj_set_style_text_color(cl[i], lv_color_hex(0x6B7280), LV_PART_MAIN);
            } else {
              buf[i][0] = ' '; buf[i][1] = 0;
              lv_obj_set_style_text_font(cl[i], &lv_font_montserrat_18, LV_PART_MAIN);
              lv_label_set_text(cl[i], buf[i]);
            }
            // Check flags wrong-but-not-yet-conflicting entries. A given can
            // never be wrong, so givens are never flagged.
            const bool flagged = id(sud_show_errors) && !given && v != 0 &&
                                 v != id(sud_sol)[i];
            // Digit highlight: a placed copy lights strongly, a cell only
            // PENCILLED with it lights faintly — that second one is what
            // makes the feature useful for narrowing candidates.
            const bool lit  = id(sud_hl) != 0 && v == id(sud_hl);
            const bool lit2 = id(sud_hl) != 0 && v == 0 &&
                              (id(sud_marks)[i] & (1 << (id(sud_hl) - 1)));
            lv_obj_set_style_bg_color(cb[i],
              (i == id(sud_sel)) ? lv_color_hex(0x2D6CDF) :
              flagged            ? lv_color_hex(0x5A2326) :
              lit                ? lv_color_hex(0x1E4D3C) :
              lit2               ? lv_color_hex(0x24332C) :
              given              ? lv_color_hex(0x1E2228)
                                 : lv_color_hex(0x2A2F37), LV_PART_MAIN);
          }
          // Tint the keypad so the active highlight is visible where you
          // pressed it, not only out on the board.
          lv_obj_t *keys[9] = {id(sudkey_1), id(sudkey_2), id(sudkey_3), id(sudkey_4), id(sudkey_5), id(sudkey_6), id(sudkey_7), id(sudkey_8), id(sudkey_9)};
          for (int d = 1; d <= 9; d++)
            lv_obj_set_style_bg_color(keys[d - 1],
              (id(sud_hl) == d) ? lv_color_hex(0x1E4D3C) : lv_color_hex(0x1E2228),
