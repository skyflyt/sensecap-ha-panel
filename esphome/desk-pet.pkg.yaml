# ─────────────────────────────────────────────────────────────────────────────
# Desk Pet — ESPHome package for the Seeed SenseCAP Indicator D1
#
# A Tamagotchi that levels up on evidence you did some work, living on a 4"
# 480x480 touchscreen. Home Assistant holds the brain; this package is the face
# and the games.
#
# HOW TO USE IT
#
#   packages:
#     desk_pet: !include desk-pet.pkg.yaml
#
# See example-device.yaml for a minimal host config that compiles on its own,
# and README.md for the whole story.
#
# ⚠️ EVERY ${entity_*} BELOW IS A PLACEHOLDER. There are four of them, all
#    optional, all guarded by has_state(): entity_meeting_state,
#    entity_monitor_power, entity_agent_attention, entity_mail_state.
#    example-device.yaml declares them in one `substitutions:` block with a
#    note on what each is expected to be.
#
#    The Home Assistant package has MORE placeholders and a DIFFERENT scheme:
#    HA has no substitution mechanism, so it carries literal `CHANGE_ME_` ids.
#    Grep that file separately.
#
# ⚠️ THIS ASSEMBLY HAS NOT BEEN COMPILED. The blocks below are lifted, byte for
#    byte, out of a larger private config that has been running on a desk since
#    August 2026. What is new is the assembly into a standalone package and the
#    substitutions. So: run `esphome config`, then `esphome compile`, then LOOK
#    AT THE PANEL — in that order, and do not skip the third one. A clean
#    compile is not evidence that anything renders. See docs/LIMITATIONS.md.
# ─────────────────────────────────────────────────────────────────────────────

esphome:
  includes:
    - desk_pet_helpers.h

globals:
  # Which nav tab is lit. See the nav_select stub in the script block below.
  - id: nav_idx
    type: int
    restore_value: false
    initial_value: '0'
  # Desk pet idle bob. restore_value: false like every global here — the pet's
  # real state lives in HA, and NVS is not a database.
  - id: pet_bob_up
    type: bool
    restore_value: false
    initial_value: 'false'
  # True while the pet page is showing — gates the 700 ms bob so it costs
  # nothing on the other fifteen pages.
  - id: pet_page_active
    type: bool
    restore_value: false
    initial_value: 'false'
  # ── Catch-the-pet minigame (2026-08-25) ────────────────────────────────────
  # Runs ENTIRELY on the device. No HA round trip during play, deliberately:
  # the README's latency section measured the round trip at HASS.Agent's serial
  # PowerShell polling (~870 ms/spawn), and a reaction game with a network hop
  # in it is not a game. HA is told once, at the end, what the score was.
  - id: pet_game_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: pet_game_score
    type: int
    restore_value: false
    initial_value: '0'
  - id: pet_game_time
    type: int
    restore_value: false
    initial_value: '0'
  - id: pet_game_slot
    type: int
    restore_value: false
    initial_value: '0'
  # Which game reported the score — the HA side logs it so the three can be
  # balanced against each other later from evidence rather than taste.
  # 1 = Catch, 2 = Echo, 3 = Spot.
  - id: pet_game_which
    type: int
    restore_value: false
    initial_value: '1'
  # ── Echo (repeat-the-sequence) ─────────────────────────────────────────────
  - id: echo_seq
    type: int[10]
    restore_value: false
  - id: echo_len
    type: int
    restore_value: false
    initial_value: '0'
  - id: echo_pos
    type: int
    restore_value: false
    initial_value: '0'
  - id: echo_play_i
    type: int
    restore_value: false
    initial_value: '0'
  - id: echo_accepting
    type: bool
    restore_value: false
    initial_value: 'false'
  # Which pad is lit right now during playback; -1 = none.
  - id: echo_cur
    type: int
    restore_value: false
    initial_value: '-1'
  # Monotonic count of panel touches since boot, published to HA every 60 s.
  # `restore_value: false` like every global here — it resets to 0 on reboot
  # and on every reflash, which is FINE and is handled HA-side: the awarding
  # automation treats a decrease as a re-baseline rather than a negative delta.
  # Given how often this panel is reflashed, that path is the normal case, not
  # an edge case.
  - id: panel_touches
    type: int
    restore_value: false
    initial_value: '0'
  # ── Spot (find the odd one) ────────────────────────────────────────────────
  - id: spot_target
    type: int
    restore_value: false
    initial_value: '0'
  - id: spot_round
    type: int
    restore_value: false
    initial_value: '0'

  # >>> PUZZLE-GEN globals
  # Peg solitaire. `peg_board` is 1 = peg, 0 = empty; `peg_sel` is the
  # selected hole or -1. `peg_live` survives leaving the page, which is
  # the whole point of a call-friendly puzzle.
  - id: peg_board
    type: int[15]
    restore_value: false
  - id: peg_sel
    type: int
    restore_value: false
    initial_value: '-1'
  - id: peg_left
    type: int
    restore_value: false
    initial_value: '0'
  - id: peg_live
    type: bool
    restore_value: false
    initial_value: 'false'
  # Lights Out: 25 cells, 1 = lit.
  - id: lo_board
    type: int[25]
    restore_value: false
  - id: lo_moves
    type: int
    restore_value: false
    initial_value: '0'
  - id: lo_live
    type: bool
    restore_value: false
    initial_value: 'false'
  # Memory: `mem_face` is the symbol 1..8 under each card, `mem_up` is
  # 0 hidden / 1 face-up / 2 matched.
  - id: mem_face
    type: int[16]
    restore_value: false
  - id: mem_up
    type: int[16]
    restore_value: false
  - id: mem_a
    type: int
    restore_value: false
    initial_value: '-1'
  - id: mem_b
    type: int
    restore_value: false
    initial_value: '-1'
  - id: mem_pairs
    type: int
    restore_value: false
    initial_value: '0'
  - id: mem_moves
    type: int
    restore_value: false
    initial_value: '0'
  - id: mem_live
    type: bool
    restore_value: false
    initial_value: 'false'
  # <<< PUZZLE-GEN globals
  # >>> SUDOKU-GEN globals
  # Sudoku. `sud_given` is the dealt puzzle (0 = blank), `sud_cur` is the
  # grid as played, `sud_sol` the answer. All three arrive from HA as
  # 81-character strings — the device never generates a puzzle, because
  # producing one with a unique solution is a backtracking search on the
  # same core that drives LVGL.
  - id: sud_given
    type: int[81]
    restore_value: false
  - id: sud_cur
    type: int[81]
    restore_value: false
  - id: sud_sol
    type: int[81]
    restore_value: false
  - id: sud_sel
    type: int
    restore_value: false
    initial_value: '-1'
  # Set by the Check button. Flags entries that are WRONG but do not yet
  # conflict with anything — the live conflict highlight cannot catch
  # those, and hunting one wrong digit across 81 cells is the one way this
  # game stops being relaxing.
  - id: sud_show_errors
    type: bool
    restore_value: false
    initial_value: 'false'
  # Pencil marks: one 9-bit mask per cell, bit (v-1) set = candidate v is
  # pencilled in. A bitmask rather than 81 lists — one int per cell, and
  # toggling is a single XOR.
  - id: sud_marks
    type: int[81]
    restore_value: false
  - id: sud_pencil
    type: bool
    restore_value: false
    initial_value: 'false'
  # ── Power theatre (2026-08-27) ──────────────────────────────────────────────
  # Which power is running (1 Tidy · 2 Den · 3 Doctor · 4 Fetch), and how far
  # through its sequence. Reported: tapping a power did the work but looked like
  # nothing happened, so there was no way to tell it from a dead button — the
  # same complaint as the silent Train button, and the same fix: make the thing
  # SAY what it did.
  - id: pw_which
    type: int
    restore_value: false
    initial_value: '0'
  - id: pw_step
    type: int
    restore_value: false
    initial_value: '0'
  - id: pw_running
    type: bool
    restore_value: false
    initial_value: 'false'
  # Digit-highlight: with NO cell selected, tapping 1-9 lights every
  # instance of that digit on the board. 0 = off. This is the one sudoku
  # affordance people miss immediately when it is absent — scanning for
  # 'where are the 7s' is most of what the game actually is.
  - id: sud_hl
    type: int
    restore_value: false
    initial_value: '0'
  - id: sud_loaded
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: sud_done
    type: bool
    restore_value: false
    initial_value: 'false'
  # <<< SUDOKU-GEN globals

script:
  # ── nav_select — STUB ───────────────────────────────────────────────────────
  # Every page extracted here calls `nav_select` from its `on_load`, because on
  # the panel these pages sit under a persistent five-tab nav bar and the tab
  # has to light up.
  #
  # THIS REPO DOES NOT SHIP A NAV BAR — yours will have different tabs, or none.
  # So this is a no-op that records the index and nothing else, which is enough
  # to make every `on_load` resolve and compile.
  #
  # If you have a nav bar, replace the body: set each tab's `checked` state from
  # `idx`, and set each tab label's `text_color` explicitly. The colour is not
  # optional — see the `text_color` warning on the `tile` style in
  # example-device.yaml. And write the colour as a block-scalar `if`, not an
  # inline ternary: YAML reads the " : " in `a ? b : c` as a mapping separator
  # and the whole file fails to parse.
  - id: nav_select
    mode: restart
    parameters:
      idx: int
    then:
      - lambda: 'id(nav_idx) = idx;'

  - id: refresh_pet
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_pet_name
          text: !lambda |-
            if (!id(ha_pet_name).has_state()) return std::string("Pet");
            return id(ha_pet_name).state;
      # Level AND xp in the one chip. The ring still shows progress as a shape;
      # the chip carries the numbers, out from under the arc stroke.
      - lvgl.label.update:
          id: lbl_pet_level
          text: !lambda |-
            if (!id(ha_pet_state).has_state()) return std::string("--");
            const std::string s = id(ha_pet_state).state;
            const int lvl = indicator_state_int(s, "lvl", 1);
            const int xp  = indicator_state_int(s, "xp", 0);
            if (lvl >= 8)
              return std::string("Lv 8  ") + std::to_string(xp) + " xp";
            return std::string("Lv ") + std::to_string(lvl) + "   " +
                   std::to_string(xp) + " / " +
                   std::to_string(indicator_state_int(s, "nxt", 0));
      # The XP ring. Doubles as the frame the sprite sits inside — the Energy
      # page already uses an arc this way.
      - lvgl.arc.update:
          id: arc_pet_xp
          value: !lambda |-
            if (!id(ha_pet_state).has_state()) return 0;
            return indicator_state_int(id(ha_pet_state).state, "pct", 0);
      # Stage 1 = egg, stage 2+ = hatchling. TWO WIDGETS, one hidden — not one
      # widget with a swapped `src`. Same reasoning as the Fetch button:
      # hide/show is what the rest of this config uses and is known good, and a
      # sprite that silently fails to swap is indistinguishable from a pet that
      # has not levelled.
      - if:
          condition:
            lambda: |-
              if (!id(ha_pet_state).has_state()) return false;
              return indicator_state_int(id(ha_pet_state).state, "stg", 1) >= 2;
          then:
            - lvgl.widget.hide: img_pet_stage1
            - lvgl.widget.show: img_pet_stage2
            - lvgl.widget.hide: img_game_egg
            - lvgl.widget.show: img_game_hatch
          else:
            - lvgl.widget.show: img_pet_stage1
            - lvgl.widget.hide: img_pet_stage2
            - lvgl.widget.show: img_game_egg
            - lvgl.widget.hide: img_game_hatch
      # ── The creature itself, per level ──────────────────────────────────
      # The "stage 2" widget is now the whole ladder from level 2 up; its SOURCE
      # follows the level. Eight stacked widgets in each of the four places a
      # sprite appears would have been 24 more LVGL objects to say exactly this.
      - lvgl.image.update:
          id: img_pet_stage2
          src: !lambda |-
            int lvl = id(ha_pet_state).has_state()
                ? indicator_state_int(id(ha_pet_state).state, "lvl", 1) : 1;
            if (lvl > 8) lvl = 8;
            switch (lvl) {
              case 3: return id(img_pet_s3);
              case 4: return id(img_pet_s4);
              case 5: return id(img_pet_s5);
              case 6: return id(img_pet_s6);
              case 7: return id(img_pet_s7);
              case 8: return id(img_pet_s8);
            }
            return id(img_pet_hatchling);
      - lvgl.image.update:
          id: ico_pet_hatch
          src: !lambda |-
            int lvl = id(ha_pet_state).has_state()
                ? indicator_state_int(id(ha_pet_state).state, "lvl", 1) : 1;
            if (lvl > 8) lvl = 8;
            switch (lvl) {
              case 3: return id(img_pet_t3);
              case 4: return id(img_pet_t4);
              case 5: return id(img_pet_t5);
              case 6: return id(img_pet_t6);
              case 7: return id(img_pet_t7);
              case 8: return id(img_pet_t8);
            }
            return id(img_pet_hatchling_sm);
      - lvgl.image.update:
          id: img_game_hatch
          src: !lambda |-
            int lvl = id(ha_pet_state).has_state()
                ? indicator_state_int(id(ha_pet_state).state, "lvl", 1) : 1;
            if (lvl > 8) lvl = 8;
            switch (lvl) {
              case 3: return id(img_pet_s3);
              case 4: return id(img_pet_s4);
              case 5: return id(img_pet_s5);
              case 6: return id(img_pet_s6);
              case 7: return id(img_pet_s7);
              case 8: return id(img_pet_s8);
            }
            return id(img_pet_hatchling);
      - lvgl.image.update:
          id: pw_pet2
          src: !lambda |-
            int lvl = id(ha_pet_state).has_state()
                ? indicator_state_int(id(ha_pet_state).state, "lvl", 1) : 1;
            if (lvl > 8) lvl = 8;
            switch (lvl) {
              case 3: return id(img_pet_s3);
              case 4: return id(img_pet_s4);
              case 5: return id(img_pet_s5);
              case 6: return id(img_pet_s6);
              case 7: return id(img_pet_s7);
              case 8: return id(img_pet_s8);
            }
            return id(img_pet_hatchling);

      # ── Level appearance ────────────────────────────────────────────────
      # Every level after 2 adds something visible. Accessories ACCUMULATE, so
      # the pet is plainly further along at a glance rather than merely
      # different — and the sprite itself warms in tint as it goes.
      #   L3 aura · L4 + hat · L5 + scarf · L6 + sparks · L7-8 gold tint
      - lambda: |-
          const int lvl = id(ha_pet_state).has_state()
              ? indicator_state_int(id(ha_pet_state).state, "lvl", 1) : 1;
          auto vis = [](lv_obj_t *o, bool on) {
            if (on) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            else    lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          vis(id(pet_aura),   lvl >= 3);
          // HAT AND SCARF ARE OFF PERMANENTLY. The sprite ladder now draws a
          // crest at L4 and a scarf at L5 into the creature itself, so the LVGL
          // overlays would sit on top of the same features and read as a
          // duplicate. Kept as widgets rather than deleted because they are the
          // hook for real accessories later (sprites doc § 4), which are earned
          // and equipped rather than automatic with level.
          vis(id(pet_hat),    false);
          vis(id(pet_scarf),  false);
          // Sparks stay: the sprite has no equivalent, so they still add
          // something at L6 rather than repeating it.
          vis(id(pet_spark1), lvl >= 6);
          vis(id(pet_spark2), lvl >= 6);
          // The ring thickens and warms with level, so even a level that adds
          // no new accessory still reads as a step up rather than a plateau.
          lv_obj_set_style_border_width(id(pet_aura),
            lvl >= 7 ? 5 : lvl >= 5 ? 4 : 3, LV_PART_MAIN);
          lv_obj_set_style_border_color(id(pet_aura),
            lvl >= 7 ? lv_color_hex(0xFFD24A) : lv_color_hex(0xF2B01E), LV_PART_MAIN);
          // No runtime recolour any more: stages 7 and 8 are drawn gold in the
          // sprite itself, and tinting on top of that would only mud it.
      # The Main-page tile shows the same creature at a glance.
      - if:
          condition:
            lambda: |-
              if (!id(ha_pet_state).has_state()) return false;
              return indicator_state_int(id(ha_pet_state).state, "stg", 1) >= 2;
          then:
            - lvgl.widget.hide: ico_pet_egg
            - lvgl.widget.show: ico_pet_hatch
          else:
            - lvgl.widget.show: ico_pet_egg
            - lvgl.widget.hide: ico_pet_hatch
      - lvgl.label.update:
          id: lbl_pet_tile
          text: !lambda |-
            if (!id(ha_pet_state).has_state()) return std::string("Pet");
            const std::string s = id(ha_pet_state).state;
            if (indicator_state_int(s, "rdy", 0) == 1) return std::string("READY");
            return std::string("Lv") + std::to_string(indicator_state_int(s, "lvl", 1)) +
                   "  " + std::to_string(indicator_state_int(s, "pct", 0)) + "%";
          text_color: !lambda |-
            if (!id(ha_pet_state).has_state()) return lv_color_hex(0x6B7280);
            if (indicator_state_int(id(ha_pet_state).state, "rdy", 0) == 1)
              return lv_color_hex(0xF2B01E);
            return lv_color_hex(0x9AA0A6);
      # The tile's two edge bars. See the note on btn_pet_tile: on THIS widget
      # both bars mean "needs attention", so a clean tile is good news and any
      # amber is a prompt. Nothing here ever goes red — the pet does not get to
      # raise an alarm on the Main page.
      - lambda: |-
          int hun = 0, spi = 100;
          if (id(ha_pet_state).has_state()) {
            hun = indicator_state_int(id(ha_pet_state).state, "hun", 0);
            spi = indicator_state_int(id(ha_pet_state).state, "spi", 100);
          }
          const int want_food = hun;          // rises as he gets hungry
          const int want_play = 100 - spi;    // rises as his spirit fades
          lv_bar_set_value(id(bar_tile_hunger), want_food, LV_ANIM_OFF);
          lv_bar_set_value(id(bar_tile_spirit), want_play, LV_ANIM_OFF);
          // Below a third the fill stays neutral grey against a visible track,
          // so the bars are always legible AS bars and only the colour changes
          // when something wants doing. A rest state that renders as literally
          // nothing reads as a missing feature, which is exactly how the first
          // version was reported.
          lv_obj_set_style_bg_color(id(bar_tile_hunger),
            want_food >= 34 ? lv_color_hex(0xF2B01E) : lv_color_hex(0x6B7280),
            LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(bar_tile_spirit),
            want_play >= 34 ? lv_color_hex(0xF2B01E) : lv_color_hex(0x6B7280),
            LV_PART_INDICATOR);
          // Floor the drawn length at 4% so a healthy pet still shows two
          // faint ticks rather than two empty tracks.
          lv_bar_set_value(id(bar_tile_hunger), want_food < 4 ? 4 : want_food, LV_ANIM_OFF);
          lv_bar_set_value(id(bar_tile_spirit), want_play < 4 ? 4 : want_play, LV_ANIM_OFF);
      # Three chips instead of one run-on line. Each caps out amber so "you have
      # spent today's allowance" reads at a glance rather than needing the
      # numbers compared.
      - lambda: |-
          auto n = [](text_sensor::TextSensor *s) -> int {
            return s->has_state() ? (int) atof(s->state.c_str()) : 0;
          };
          const int w = n(id(ha_pet_work_today));
          const int g = n(id(ha_pet_games_today));
          const int p = n(id(ha_pet_taps_today));
          int cg = 40, cp = 20;
          if (id(ha_pet_settings).has_state()) {
            cg = indicator_state_int(id(ha_pet_settings).state, "cg", 40);
            cp = indicator_state_int(id(ha_pet_settings).state, "cp", 20);
          }
          static char bw[24], bg[24], bp[24];
          snprintf(bw, sizeof(bw), "work %d", w);
          snprintf(bg, sizeof(bg), "play %d/%d", g, cg);
          snprintf(bp, sizeof(bp), "panel %d/%d", p, cp);
          lv_label_set_text(id(lbl_chip_work), bw);
          lv_label_set_text(id(lbl_chip_play), bg);
          lv_label_set_text(id(lbl_chip_panel), bp);
          // Work is uncapped, so it is never "full" — it just accrues.
          lv_obj_set_style_text_color(id(lbl_chip_work), lv_color_hex(0x9AA0A6), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_chip_play),
            (cg > 0 && g >= cg) ? lv_color_hex(0xF2B01E) : lv_color_hex(0x9AA0A6), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_chip_panel),
            (cp > 0 && p >= cp) ? lv_color_hex(0xF2B01E) : lv_color_hex(0x9AA0A6), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(chip_play),
            (cg > 0 && g >= cg) ? lv_color_hex(0xF2B01E) : lv_color_hex(0x2A2F37), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(chip_panel),
            (cp > 0 && p >= cp) ? lv_color_hex(0xF2B01E) : lv_color_hex(0x2A2F37), LV_PART_MAIN);
      # FED — drawn as a FILL (100 = just fed, amber) so it reads the same way
      # as spirit: more bar is always better. An earlier version drew hunger as
      # a deficit, deliberately opposite to spirit; in practice a nearly-empty
      # amber bar beside a full green one read as "something is wrong" when
      # both were fine. HA still tracks hun=; the panel shows 100-hun.
      - lvgl.bar.update:
          id: bar_pet_hunger
          value: !lambda |-
            if (!id(ha_pet_state).has_state()) return 100;
            return 100 - indicator_state_int(id(ha_pet_state).state, "hun", 0);
      # SPIRIT — the need that feeding cannot fix. Only playing raises it, so a
      # pet that is fed and ignored still fades. FILL, 100 = full and green.
      - lvgl.bar.update:
          id: bar_pet_spirit
          value: !lambda |-
            if (!id(ha_pet_state).has_state()) return 100;
            return indicator_state_int(id(ha_pet_state).state, "spi", 100);
      - lvgl.label.update:
          id: lbl_hunger_val
          text: !lambda |-
            if (!id(ha_pet_state).has_state()) return std::string("");
            return std::to_string(100 - indicator_state_int(id(ha_pet_state).state, "hun", 0));
      - lvgl.label.update:
          id: lbl_spirit_val
          text: !lambda |-
            if (!id(ha_pet_state).has_state()) return std::string("");
            return std::to_string(indicator_state_int(id(ha_pet_state).state, "spi", 100));
      # Powers unlock by level and the button is HIDDEN until the first one is
      # earned — a Powers page listing four locked rows is a page of nothing.
      - if:
          condition:
            lambda: |-
              if (!id(ha_pet_state).has_state()) return false;
              return indicator_state_int(id(ha_pet_state).state, "lvl", 1) >= 3;
          then:
            - lvgl.widget.show: btn_pet_powers
          else:
            - lvgl.widget.hide: btn_pet_powers
      # Main-page presence follows the setting.
      - if:
          condition:
            lambda: |-
              if (!id(ha_pet_settings).has_state()) return true;
              return indicator_state_int(id(ha_pet_settings).state, "mn", 1) == 1;
          then:
            - lvgl.widget.show: btn_pet_tile
          else:
            - lvgl.widget.hide: btn_pet_tile
      # Mood chip. The well-tended bonus rides in here rather than on its own
      # line — if care pays, that should be visible where the mood is, not in a
      # footnote.
      - lvgl.label.update:
          id: lbl_pet_mood
          text: !lambda |-
            if (!id(ha_pet_mood).has_state()) return std::string("");
            std::string out = id(ha_pet_mood).state;
            if (id(ha_pet_state).has_state()) {
              const std::string s = id(ha_pet_state).state;
              if (indicator_state_int(s, "hun", 0) < 30 &&
                  indicator_state_int(s, "spi", 100) > 60) out += "   x1.25";
            }
            return out;
          # Never red. The mood word is information, not an alarm — this pet has
          # no route to his attention that he did not open himself.
          text_color: !lambda |-
            if (!id(ha_pet_mood).has_state()) return lv_color_hex(0x6B7280);
            if (id(ha_pet_mood).state == "content") return lv_color_hex(0x35C759);
            if (id(ha_pet_mood).state == "resting") return lv_color_hex(0x6B7280);
            return lv_color_hex(0x9AA0A6);
      # TRAIN lights only when XP has actually crossed the threshold. Levelling
      # is something he does and watches, not something that happened while he
      # was in a meeting.
      - lvgl.widget.update:
          id: btn_pet_train
          bg_color: !lambda |-
            if (!id(ha_pet_state).has_state()) return lv_color_hex(0x1E2228);
            if (indicator_state_int(id(ha_pet_state).state, "rdy", 0) == 1)
              return lv_color_hex(0xF2B01E);
            return lv_color_hex(0x1E2228);
      # A button that silently does nothing is indistinguishable from a broken
      # one — reported 2026-08-25 as "the train button does not seem to do
      # anything" when it was correctly refusing a level-up that had not been
      # earned. It now always states its own precondition.
      - lvgl.label.update:
          id: lbl_pet_train
          text: !lambda |-
            if (!id(ha_pet_state).has_state()) return std::string("Train");
            const std::string s = id(ha_pet_state).state;
            if (indicator_state_int(s, "rdy", 0) == 1)
              return std::string("LEVEL\nUP!");
            int lvl = indicator_state_int(s, "lvl", 1);
            if (lvl >= 8) return std::string("Train\nmaxed");
            int need = indicator_state_int(s, "nxt", 0) -
                       indicator_state_int(s, "xp", 0);
            if (need < 0) need = 0;
            return std::string("Train\n") + std::to_string(need) + " to go";
          text_color: !lambda |-
            if (!id(ha_pet_state).has_state()) return lv_color_hex(0x6B7280);
            if (indicator_state_int(id(ha_pet_state).state, "rdy", 0) == 1)
              return lv_color_hex(0x14161A);
            // Dim when it cannot act — an affordance that looks live and is
            // not is the whole complaint.
            return lv_color_hex(0x6B7280);
      # Each power's row on the Powers page shows either what it does or what it
      # is waiting for. Locked rows stay visible — seeing what is coming is
      # most of the reason to keep levelling.
      - lvgl.label.update:
          id: lbl_pw_tidy
          text: !lambda |-
            if (!id(ha_pet_state).has_state()) return std::string("");
            return indicator_state_int(id(ha_pet_state).state, "lvl", 1) >= 3
                   ? std::string("sweep Outlook + Gmail") : std::string("locked - level 3");
          text_color: !lambda |-
            if (!id(ha_pet_state).has_state()) return lv_color_hex(0x4B5563);
            return indicator_state_int(id(ha_pet_state).state, "lvl", 1) >= 3
                   ? lv_color_hex(0x9AA0A6) : lv_color_hex(0x4B5563);
      - lvgl.label.update:
          id: lbl_pw_den
          text: !lambda |-
            if (!id(ha_pet_state).has_state()) return std::string("");
            return indicator_state_int(id(ha_pet_state).state, "lvl", 1) >= 4
                   ? std::string("lights off, mic muted, media paused")
                   : std::string("locked - level 4");
          text_color: !lambda |-
            if (!id(ha_pet_state).has_state()) return lv_color_hex(0x4B5563);
            return indicator_state_int(id(ha_pet_state).state, "lvl", 1) >= 4
                   ? lv_color_hex(0x9AA0A6) : lv_color_hex(0x4B5563);
      - lvgl.label.update:
          id: lbl_pw_doctor
          text: !lambda |-
            if (!id(ha_pet_state).has_state()) return std::string("");
            return indicator_state_int(id(ha_pet_state).state, "lvl", 1) >= 5
                   ? std::string("run the health check on the PC")
                   : std::string("locked - level 5");
          text_color: !lambda |-
            if (!id(ha_pet_state).has_state()) return lv_color_hex(0x4B5563);
            return indicator_state_int(id(ha_pet_state).state, "lvl", 1) >= 5
                   ? lv_color_hex(0x9AA0A6) : lv_color_hex(0x4B5563);
      - lvgl.label.update:
          id: lbl_pw_fetch
          text: !lambda |-
            if (!id(ha_pet_state).has_state()) return std::string("");
            return indicator_state_int(id(ha_pet_state).state, "lvl", 1) >= 6
                   ? std::string("focus whatever is shouting loudest")
                   : std::string("locked - level 6");
          text_color: !lambda |-
            if (!id(ha_pet_state).has_state()) return lv_color_hex(0x4B5563);
            return indicator_state_int(id(ha_pet_state).state, "lvl", 1) >= 6
                   ? lv_color_hex(0x9AA0A6) : lv_color_hex(0x4B5563);
  # ── Settings page: paint every toggle from the encoded settings string ─────
  # Checked state AND colour are set explicitly. A checkable button that only
  # signals via the theme's checked style is unreadable across a room, and this
  # panel is held to a read-from-across-the-room standard throughout.
  - id: refresh_pet_settings
    mode: restart
    then:
      - lambda: |-
          if (!id(ha_pet_settings).has_state()) return;
          const std::string s = id(ha_pet_settings).state;
          struct Row { lv_obj_t *btn; lv_obj_t *lbl; const char *key; };
          const Row rows[] = {
            {id(set_enabled),  id(lbl_set_enabled),  "en"},
            {id(set_locked),   id(lbl_set_locked),   "lk"},
            {id(set_meeting),  id(lbl_set_meeting),  "mt"},
            {id(set_incident), id(lbl_set_incident), "ic"},
            {id(set_onmain),   id(lbl_set_onmain),   "mn"},
          };
          for (auto &r : rows) {
            const bool on = indicator_state_int(s, r.key, 1) == 1;
            lv_obj_set_style_bg_color(r.btn,
              on ? lv_color_hex(0xF2B01E) : lv_color_hex(0x2A2F37), LV_PART_MAIN);
            lv_label_set_text(r.lbl, on ? "ON" : "OFF");
            lv_obj_set_style_text_color(r.lbl,
              on ? lv_color_hex(0x14161A) : lv_color_hex(0x9AA0A6), LV_PART_MAIN);
          }
      - lvgl.label.update:
          id: lbl_set_gamelen
          text: !lambda |-
            if (!id(ha_pet_settings).has_state()) return std::string("--");
            const int g = indicator_state_int(id(ha_pet_settings).state, "gl", 12);
            return std::to_string(g) + "s";
      - lvgl.label.update:
          id: lbl_set_caps
          text: !lambda |-
            if (!id(ha_pet_settings).has_state()) return std::string("");
            const std::string s = id(ha_pet_settings).state;
            return std::string("play ") + std::to_string(indicator_state_int(s, "cg", 40)) +
                   "/day    panel " + std::to_string(indicator_state_int(s, "cp", 20)) + "/day";

  # Two-position bob on a 700 ms interval. Not an animation — LVGL moves the
  # sprite 2 px and back, which reads as breathing and costs no flash at all.
  # Real frame animation waits for the modular-parts work (slice 3).
  #
  # ⚠️ `y:` here is an ABSOLUTE offset from the widget's align anchor, NOT a
  # delta. The first version set -2/+2 and the sprite jumped from its centred
  # position to the top of the screen on the first tick — reported 2026-08-24 as
  # "it's at the top, not in the middle of the circle". Bob AROUND the resting
  # position, never from zero.
  #
  # ⚠️ AND KEEP THESE IN STEP WITH THE WIDGET'S DECLARED y. The chip-layout
  # rework moved the sprite from y104 to y82 and left these at 102/106, so the
  # sprite sat correctly for exactly one frame and then dropped 20 px on the
  # first tick — reported 2026-08-27 as "the pet is a little low and not
  # centered in the ring". The declared y and these two numbers are one fact
  # stored twice; change them together.
  - id: pet_bob
    mode: restart
    then:
      - lambda: 'id(pet_bob_up) = !id(pet_bob_up);'
      - lvgl.widget.update:
          id: img_pet_stage1
          y: !lambda 'return id(pet_bob_up) ? 80 : 84;'
      - lvgl.widget.update:
          id: img_pet_stage2
          y: !lambda 'return id(pet_bob_up) ? 80 : 84;'

  # ── Catch-the-pet: hop to a new slot ───────────────────────────────────────
  # Six slots in a 3x2 grid. The hit button is the PARENT and the two sprites
  # are its children, so moving the button moves the artwork with it — one
  # update instead of three that could drift apart.
  #
  # Never picks the slot it is already in: a "hop" that does not move reads as
  # the game having frozen.
  - id: pet_hop
    mode: restart
    then:
      - lambda: |-
          int next = id(pet_game_slot);
          while (next == id(pet_game_slot)) next = esphome::random_uint32() % 6;
          id(pet_game_slot) = next;
      - lvgl.widget.update:
          id: btn_pet_hit
          x: !lambda |-
            const int col = id(pet_game_slot) % 3;
            return 30 + col * 168;
          y: !lambda |-
            const int row = id(pet_game_slot) / 3;
            return 86 + row * 150;

  # One second of clock. Ends the round at zero and hands the score to HA.
  - id: pet_game_tick
    mode: single
    then:
      - lambda: 'id(pet_game_time) = id(pet_game_time) - 1;'
      - lvgl.label.update:
          id: lbl_game_time
          text: !lambda 'return std::to_string(id(pet_game_time)) + "s";'
      - if:
          condition:
            lambda: 'return id(pet_game_time) <= 0;'
          then:
            - script.execute: pet_game_end

  - id: pet_game_start
    mode: restart
    then:
      - lambda: |-
          id(pet_game_score) = 0;
          // Round length comes from settings (Short 8 / Normal 12 / Long 20).
          id(pet_game_time) = id(ha_pet_settings).has_state()
              ? indicator_state_int(id(ha_pet_settings).state, "gl", 12) : 12;
          id(pet_game_slot) = 99;   // forces the first hop to move
          id(pet_game_which) = 1;
          id(pet_game_active) = true;
      - lvgl.label.update:
          id: lbl_game_score
          text: "0"
      - lvgl.label.update:
          id: lbl_game_time
          text: !lambda 'return std::to_string(id(pet_game_time)) + "s";'
      - lvgl.label.update:
          id: lbl_game_hint
          text: "Catch him!"
          text_color: 0x9AA0A6
      - lvgl.widget.show: btn_pet_hit
      - script.execute: pet_hop

  - id: pet_game_end
    mode: single
    then:
      - lambda: 'id(pet_game_active) = false;'
      - lvgl.widget.hide: btn_pet_hit
      - lvgl.label.update:
          id: lbl_game_time
          text: "done"
      - lvgl.label.update:
          id: lbl_game_hint
          text: !lambda |-
            const int s = id(pet_game_score);
            // Never scolds a low score. The worst outcome is neutral.
            if (s >= 18) return std::string("Brilliant! He is worn out.");
            if (s >= 10) return std::string("Good run. He had fun.");
            if (s >= 4)  return std::string("Nice. He enjoyed that.");
            return std::string("He enjoyed that.");
          text_color: 0xF2B01E
      # Tell HA once, at the end. Score drives both the XP and the happiness.
      #
      # ⚠️ `variables:` ALONE DOES NOT REACH THE SCRIPT. In ESPHome, `variables`
      # are device-side lambdas whose results are substituted into
      # `data_template` Jinja by HA — they are not service-call data. The first
      # version passed only `variables:`, the script received no `score` field,
      # `score | int(0)` evaluated to 0, and every round awarded exactly zero
      # XP. It looked like the game "just wasn't wired up"; in fact the call
      # fired every time (`last_triggered` proved it) and delivered nothing.
      # The pairing below is the documented shape. Do not drop `data_template`.
      - homeassistant.action:
          action: script.indicator_pet_played
          data_template:
            score: "{{ sc }}"
            game: "{{ gm }}"
          variables:
            sc: !lambda 'return id(pet_game_score);'
            gm: !lambda 'return id(pet_game_which);'

  # ── ECHO: the pet flashes a sequence, you repeat it ────────────────────────
  # Memory rather than reflex, so it is a genuinely different game from Catch
  # rather than the same one with different art. Sequence grows by one each
  # round; one wrong pad ends it. Score reported is the longest sequence
  # completed, x2 so a good round lands near the same value as a good Catch.
  - id: echo_paint
    mode: restart
    then:
      - lvgl.widget.update:
          id: pad_a
          bg_color: !lambda 'return id(echo_cur) == 0 ? lv_color_hex(0xF2B01E) : lv_color_hex(0x2A2F37);'
      - lvgl.widget.update:
          id: pad_b
          bg_color: !lambda 'return id(echo_cur) == 1 ? lv_color_hex(0x35C759) : lv_color_hex(0x2A2F37);'
      - lvgl.widget.update:
          id: pad_c
          bg_color: !lambda 'return id(echo_cur) == 2 ? lv_color_hex(0x2563EB) : lv_color_hex(0x2A2F37);'
      - lvgl.widget.update:
          id: pad_d
          bg_color: !lambda 'return id(echo_cur) == 3 ? lv_color_hex(0xE5484D) : lv_color_hex(0x2A2F37);'

  - id: echo_play_sequence
    mode: restart
    then:
      - lambda: 'id(echo_accepting) = false; id(echo_play_i) = 0;'
      - lvgl.label.update:
          id: lbl_echo_hint
          text: "watch..."
          text_color: 0x9AA0A6
      - delay: 500ms
      # Flashing is INLINE in the repeat rather than a sub-script. Calling a
      # sub-script and then waiting on `is_running()` races: the wait can be
      # evaluated before the script has started, see it idle, and fall through
      # instantly — playing the whole sequence in one frame.
      - repeat:
          count: !lambda 'return id(echo_len);'
          then:
            - lambda: 'id(echo_cur) = id(echo_seq)[id(echo_play_i)];'
            - script.execute: echo_paint
            - delay: 380ms
            - lambda: 'id(echo_cur) = -1;'
            - script.execute: echo_paint
            - delay: 220ms
            - lambda: 'id(echo_play_i) = id(echo_play_i) + 1;'
      - lambda: 'id(echo_pos) = 0; id(echo_accepting) = true;'
      - lvgl.label.update:
          id: lbl_echo_hint
          text: "your turn"
          text_color: 0xF2B01E

  - id: echo_next_round
    mode: restart
    then:
      - lambda: |-
          if (id(echo_len) < 10) {
            id(echo_seq)[id(echo_len)] = esphome::random_uint32() % 4;
            id(echo_len) = id(echo_len) + 1;
          }
      - lvgl.label.update:
          id: lbl_echo_score
          text: !lambda 'return std::to_string(id(echo_len));'
      - script.execute: echo_play_sequence

  - id: echo_start
    mode: restart
    then:
      - lambda: |-
          id(echo_len) = 0;
          id(pet_game_which) = 2;
          id(pet_game_active) = true;
      - lvgl.label.update:
          id: lbl_echo_score
          text: "0"
      - script.execute: echo_next_round

  - id: echo_fail
    mode: single
    then:
      - lambda: 'id(echo_accepting) = false; id(pet_game_active) = false;'
      - lvgl.label.update:
          id: lbl_echo_hint
          # Never scolds. The pet had fun either way.
          text: !lambda |-
            const int n = id(echo_len) - 1;
            if (n >= 7) return std::string("Incredible memory!");
            if (n >= 4) return std::string("Good run!");
            return std::string("He liked that.");
          text_color: 0xF2B01E
      - lambda: 'id(pet_game_score) = (id(echo_len) - 1) * 2;'
      - homeassistant.action:
          action: script.indicator_pet_played
          data_template:
            score: "{{ sc }}"
            game: "{{ gm }}"
          variables:
            sc: !lambda 'return id(pet_game_score) < 0 ? 0 : id(pet_game_score);'
            gm: !lambda 'return 2;'

  # One handler per pad. ESPHome scripts take no arguments from an on_click, so
  # four thin wrappers around one shared script is the cheapest honest shape.
  - id: echo_judge
    mode: single
    parameters:
      pad: int
    then:
      - if:
          condition:
            lambda: 'return id(echo_accepting);'
          then:
            - lambda: 'id(echo_cur) = pad;'
            - script.execute: echo_paint
            - delay: 140ms
            - lambda: 'id(echo_cur) = -1;'
            - script.execute: echo_paint
            - if:
                condition:
                  lambda: 'return pad == id(echo_seq)[id(echo_pos)];'
                then:
                  - lambda: 'id(echo_pos) = id(echo_pos) + 1;'
                  - if:
                      condition:
                        lambda: 'return id(echo_pos) >= id(echo_len);'
                      then:
                        - lvgl.label.update:
                            id: lbl_echo_hint
                            text: "yes!"
                            text_color: 0x35C759
                        - delay: 400ms
                        - script.execute: echo_next_round
                else:
                  - script.execute: echo_fail
  - id: echo_tap_a
    then: [{script.execute: {id: echo_judge, pad: 0}}]
  - id: echo_tap_b
    then: [{script.execute: {id: echo_judge, pad: 1}}]
  - id: echo_tap_c
    then: [{script.execute: {id: echo_judge, pad: 2}}]
  - id: echo_tap_d
    then: [{script.execute: {id: echo_judge, pad: 3}}]

  # ── SPOT: eight dots, one a different shade. Tap it. ───────────────────────
  # Visual search — a third distinct skill, and it costs no flash at all
  # because the dots are plain LVGL objs rather than art. Difficulty rises by
  # shrinking the shade gap each round, which is a one-line change rather than
  # new content.
  # Eight dots. The target sits one shade off the rest, and the gap narrows as
  # the round count climbs — difficulty by arithmetic, not by new content.
  - id: spot_paint
    mode: restart
    then:
      - lambda: |-
          // Base 0x9AA0A6; the odd dot is lifted toward white by `gap`, which
          // shrinks from 70 down to a floor of 14 so it stays findable.
          int gap = 70 - id(spot_round) * 6;
          if (gap < 14) gap = 14;
          lv_color_t base = lv_color_hex(0x6B7280);
          lv_color_t odd  = lv_color_make(0x6B + gap, 0x72 + gap, 0x80 + gap);
          lv_obj_t *dots[8] = {id(spot_0), id(spot_1), id(spot_2), id(spot_3),
                               id(spot_4), id(spot_5), id(spot_6), id(spot_7)};
          for (int i = 0; i < 8; i++) {
            lv_obj_set_style_bg_color(dots[i],
                (i == id(spot_target)) ? odd : base, LV_PART_MAIN);
          }

  - id: spot_new_round
    mode: restart
    then:
      - lambda: |-
          id(spot_target) = esphome::random_uint32() % 8;
          id(spot_round) = id(spot_round) + 1;
      - script.execute: spot_paint
      - lvgl.label.update:
          id: lbl_spot_score
          text: !lambda 'return std::to_string(id(pet_game_score));'

  - id: spot_start
    mode: restart
    then:
      - lambda: |-
          id(pet_game_score) = 0;
          id(spot_round) = 0;
          // Spot runs longer than Catch at every setting — visual search needs
          // more seconds than reflex to feel fair.
          id(pet_game_time) = (id(ha_pet_settings).has_state()
              ? indicator_state_int(id(ha_pet_settings).state, "gl", 12) : 12) + 8;
          id(pet_game_which) = 3;
          id(pet_game_active) = true;
      - lvgl.label.update:
          id: lbl_spot_time
          text: !lambda 'return std::to_string(id(pet_game_time)) + "s";'
      - lvgl.label.update:
          id: lbl_spot_hint
          text: "Find the odd one"
          text_color: 0x9AA0A6
      - script.execute: spot_new_round

  # Correct tap scores and reshuffles; a wrong tap costs nothing but the time
  # it took — there is no penalty branch anywhere in these three games.
  - id: spot_judge
    mode: single
    parameters:
      dot: int
    then:
      - if:
          condition:
            lambda: 'return id(pet_game_active) && dot == id(spot_target);'
          then:
            - lambda: 'id(pet_game_score) = id(pet_game_score) + 1;'
            - script.execute: spot_new_round
  - id: spot_hit_0
    then: [{script.execute: {id: spot_judge, dot: 0}}]
  - id: spot_hit_1
    then: [{script.execute: {id: spot_judge, dot: 1}}]
  - id: spot_hit_2
    then: [{script.execute: {id: spot_judge, dot: 2}}]
  - id: spot_hit_3
    then: [{script.execute: {id: spot_judge, dot: 3}}]
  - id: spot_hit_4
    then: [{script.execute: {id: spot_judge, dot: 4}}]
  - id: spot_hit_5
    then: [{script.execute: {id: spot_judge, dot: 5}}]
  - id: spot_hit_6
    then: [{script.execute: {id: spot_judge, dot: 6}}]
  - id: spot_hit_7
    then: [{script.execute: {id: spot_judge, dot: 7}}]

  - id: spot_tick
    mode: single
    then:
      - lambda: 'id(pet_game_time) = id(pet_game_time) - 1;'
      - lvgl.label.update:
          id: lbl_spot_time
          text: !lambda 'return std::to_string(id(pet_game_time)) + "s";'
      - if:
          condition:
            lambda: 'return id(pet_game_time) <= 0;'
          then:
            - script.execute: spot_end

  - id: spot_end
    mode: single
    then:
      - lambda: 'id(pet_game_active) = false;'
      - lvgl.label.update:
          id: lbl_spot_time
          text: "done"
      - lvgl.label.update:
          id: lbl_spot_hint
          text: !lambda |-
            const int s = id(pet_game_score);
            if (s >= 14) return std::string("Sharp eyes!");
            if (s >= 7)  return std::string("Nicely spotted.");
            return std::string("He liked that.");
          text_color: 0xF2B01E
      - homeassistant.action:
          action: script.indicator_pet_played
          data_template:
            score: "{{ sc }}"
            game: "{{ gm }}"
          variables:
            sc: !lambda 'return id(pet_game_score);'
            gm: !lambda 'return 3;'

  # >>> PUZZLE-GEN scripts
  # ── PEG SOLITAIRE ────────────────────────────────────────────────────
  # The 15-hole triangle. Tap a peg to pick it up, tap an empty hole two
  # away to jump; the peg you jumped over is removed. Leaving one peg is
  # the perfect game. Untimed on purpose.
  - id: peg_paint
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *h[15] = {id(peg_0), id(peg_1), id(peg_2), id(peg_3), id(peg_4), id(peg_5), id(peg_6), id(peg_7), id(peg_8), id(peg_9), id(peg_10), id(peg_11), id(peg_12), id(peg_13), id(peg_14)};
          for (int i = 0; i < 15; i++) {
            lv_color_t c;
            if (id(peg_board)[i] == 0)      c = lv_color_hex(0x1E2228);
            else if (i == id(peg_sel))      c = lv_color_hex(0x35C759);
            else                            c = lv_color_hex(0xF2B01E);
            lv_obj_set_style_bg_color(h[i], c, LV_PART_MAIN);
          }
      - lvgl.label.update:
          id: lbl_peg_status
          text: !lambda |-
            if (!id(peg_live)) return std::string("tap New to deal");
            // Report whether a move still exists. A peg board with no
            // legal move looks identical to one you have not solved yet,
            // and hunting for a move that is not there is the one way
            // this game is annoying rather than calming.
            const int J[36][3] = {{0,1,3}, {0,2,5}, {1,3,6}, {1,4,8}, {2,4,7}, {2,5,9}, {3,1,0}, {3,4,5}, {3,6,10}, {3,7,12}, {4,7,11}, {4,8,13}, {5,2,0}, {5,4,3}, {5,8,12}, {5,9,14}, {6,3,1}, {6,7,8}, {7,4,2}, {7,8,9}, {8,4,1}, {8,7,6}, {9,5,2}, {9,8,7}, {10,6,3}, {10,11,12}, {11,7,4}, {11,12,13}, {12,7,3}, {12,8,5}, {12,11,10}, {12,13,14}, {13,8,4}, {13,12,11}, {14,9,5}, {14,13,12}};
            bool any = false;
            for (auto &j : J)
              if (id(peg_board)[j[0]] == 1 && id(peg_board)[j[1]] == 1 && id(peg_board)[j[2]] == 0)
                { any = true; break; }
            std::string s = std::to_string(id(peg_left)) + " left";
            if (!any) {
              if (id(peg_left) == 1) return std::string("perfect - 1 left!");
              if (id(peg_left) == 2) return s + " - so close";
              return s + " - no moves";
            }
            return s;
          text_color: !lambda |-
            if (id(peg_left) == 1) return lv_color_hex(0x35C759);
            return lv_color_hex(0x9AA0A6);

  - id: peg_new
    mode: restart
    then:
      - lambda: |-
          // One random starting hole, as the wooden ones do.
          const int gap = esphome::random_uint32() % 15;
          for (int i = 0; i < 15; i++) id(peg_board)[i] = (i == gap) ? 0 : 1;
          id(peg_sel) = -1;
          id(peg_left) = 14;
          id(peg_live) = true;
      - script.execute: peg_paint

  - id: peg_tap
    mode: single
    parameters:
      hole: int
    then:
      - lambda: |-
          if (!id(peg_live)) return;
          const int J[36][3] = {{0,1,3}, {0,2,5}, {1,3,6}, {1,4,8}, {2,4,7}, {2,5,9}, {3,1,0}, {3,4,5}, {3,6,10}, {3,7,12}, {4,7,11}, {4,8,13}, {5,2,0}, {5,4,3}, {5,8,12}, {5,9,14}, {6,3,1}, {6,7,8}, {7,4,2}, {7,8,9}, {8,4,1}, {8,7,6}, {9,5,2}, {9,8,7}, {10,6,3}, {10,11,12}, {11,7,4}, {11,12,13}, {12,7,3}, {12,8,5}, {12,11,10}, {12,13,14}, {13,8,4}, {13,12,11}, {14,9,5}, {14,13,12}};
          // Tapping an occupied hole selects it (or deselects it).
          if (id(peg_board)[hole] == 1) {
            id(peg_sel) = (id(peg_sel) == hole) ? -1 : hole;
            return;
          }
          // Tapping an empty hole with a peg selected tries the jump.
          if (id(peg_sel) < 0) return;
          for (auto &j : J) {
            if (j[0] == id(peg_sel) && j[2] == hole && id(peg_board)[j[1]] == 1) {
              id(peg_board)[j[0]] = 0;
              id(peg_board)[j[1]] = 0;
              id(peg_board)[j[2]] = 1;
              id(peg_left) = id(peg_left) - 1;
              id(peg_sel) = -1;
              return;
            }
          }
      - script.execute: peg_paint

