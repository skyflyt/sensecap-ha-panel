    # ── POWER THEATRE (2026-08-27) ───────────────────────────────────────────
    # One stage, four plays. Eight dots, a sweep line, a dimmer and the pet get
    # re-choreographed per power rather than each power owning its own widgets.
    # The result panel is the point of the whole page: a power that acts
    # invisibly is indistinguishable from a broken button.
    - id: page_power
      on_load:
        - script.execute: {id: nav_select, idx: 0}
      on_unload:
        - lambda: 'id(pw_running) = false;'
        - lambda: 'lv_obj_set_style_bg_opa(id(pw_dim), 0, LV_PART_MAIN);'
      widgets:
        # Full-page dimmer, declared first so it sits behind everything. Only
        # Den uses it; the rest leave it at zero opacity.
        - obj:
