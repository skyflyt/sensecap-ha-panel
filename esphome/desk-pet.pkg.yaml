        # The xp figure used to live here at y152, inside the ring. Removed
        # 2026-08-27 — the arc sets no start/end angle, so it draws a full 360
        # background track and the lower stroke ran straight through the text.
        # Text inside a ring is a losing fight: the clear chord narrows as you
        # move away from the centre line, and the string gets LONGER as the pet
        # levels (585 -> 4 digits). It now lives in the level chip up top.

        # ── Level accessories (2026-08-27) ──────────────────────────────────
        # Reported: "advanced to level 3 and it looks exactly the same". It did
        # — the only visual step was egg -> hatchling at level 2, and nothing
        # after. These give every level a visible change with ZERO new art:
        # LVGL primitives layered on the sprite, plus a per-level recolour of
        # the sprite itself. The real modular-parts pipeline replaces this at
        # slice 3; until then a pet that never changes is the worse problem.
        #
        # Declared BEFORE the sprites where they should sit behind (the aura),
        # after where they sit on top (hat, scarf, sparks).
        - obj:
            # ⚠️ A RING, not a tinted disc. The first version was an 84x84 amber
            # FILL at 16% opacity sitting BEHIND a 64x64 sprite — only a ~10 px
            # margin ever showed, at 16% amber on near-black, which is to say
            # nothing at all. Reported as "the look hasn't changed" while the
            # show/hide logic was in fact firing correctly. An outline reads at
            # a glance and does not wash out the creature it surrounds.
            id: pet_aura
            hidden: true
            align: TOP_MID
            y: 64
            width: 100
            height: 100
            radius: 50
            bg_opa: 0%
            border_width: 3
            border_color: 0xF2B01E
            pad_all: 0

