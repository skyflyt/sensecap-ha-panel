lvgl:
  pages:
    - id: page_pet
      on_load:
        - lambda: 'id(pet_page_active) = true;'
        # Keeps Main lit — this is a sub-page of Main, reached from its strip.
        - script.execute:
            id: nav_select
            idx: 0
        - script.execute: refresh_pet
      on_unload:
        - lambda: 'id(pet_page_active) = false;'
      widgets:
        # ── Header: name left, level as a chip right ────────────────────────
        # Reworked 2026-08-25 after Skylar reported the mood line and the
        # work/play counters overlapping. They did: the mood label at y220 in
        # montserrat_16 is ~20 px tall and ran to y240, while the counters sat
        # at y232. Rather than nudge one of them, the whole page was rebuilt on
        # a chip grid with every band's extent written down — the old layout had
        # accreted six labels at hand-picked y values and had no room left to
        # absorb another.
        - label:
            id: lbl_pet_name
            align: TOP_LEFT
            x: 20
            y: 10
            text: "Pet"
            text_font: montserrat_20
            text_color: 0xE8EAED
        - obj:
            id: chip_level
            align: TOP_RIGHT
            x: -20
            y: 10
            # 156, not 96: the xp figure moved in here. It used to sit inside
            # the ring at y152, where the arc's BACKGROUND stroke runs straight
            # through it — the arc has no start/end angle set, so it draws a
            # full 360 track, not the 270 one you get by default elsewhere.
            # Reported 2026-08-27 as "the experience numbers are covered by the
            # bottom part of the ring". Inside a ring is a bad place for text.
            width: 156
            height: 28
            radius: 14
            bg_color: 0x1E2228
            bg_opa: COVER
            border_width: 1
            border_color: 0x2A2F37
            pad_all: 0
            widgets:
              - label:
                  id: lbl_pet_level
                  align: CENTER
                  text: "--"
                  text_font: montserrat_14
                  text_color: 0xF2B01E

        # XP ring with the sprite inside it. The arc is the progress bar and the
        # frame at once.
        # y39 so the arc's centre (39+75 = 114) matches the aura ring
        # (64+50 = 114) and the sprite (82+32 = 114). All three concentric.
        - arc:
            id: arc_pet_xp
            align: TOP_MID
            y: 39
            width: 150
            height: 150
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            arc_width: 8
            arc_color: 0x2A2F37
            indicator:
              arc_color: 0xF2B01E
              arc_width: 8
            knob:
              bg_opa: TRANSP
        # Two sprites stacked, one hidden. Arc runs y46..196 so its centre is
        # y121; a 64 px sprite at y82 spans y82..146, centre y114 — sitting
        # slightly high inside the ring on purpose, to leave room for the xp
        # figure underneath it and still inside the ring it describes.
        - image:
            id: img_pet_stage1
            src: img_pet_egg
            align: TOP_MID
            y: 82
        - image:
            id: img_pet_stage2
            src: img_pet_hatchling
            hidden: true
            align: TOP_MID
            y: 82
        # Hat (L4), scarf (L5), and two sparks (L6). Drawn as plain objects on
        # top of the sprite — a 6 px band reads as a scarf at this size, and it
        # costs nothing to add another at level 7.
        - obj:
            id: pet_hat
            hidden: true
            align: TOP_MID
            y: 76
            width: 44
