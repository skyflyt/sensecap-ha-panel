# ─────────────────────────────────────────────────────────────────────────────
# Example device config — Seeed SenseCAP Indicator D1.
#
# The smallest thing that boots the panel and stands up the desk-pet page on
# it. It is a STARTING POINT for your own panel, not a finished one: there is
# one nearly-empty main page here, and the pages you actually want (lights,
# climate, energy, whatever your house has) are yours to add.
#
# See esphome/patterns/ for the chrome — nav bar, tile styles, sub-pages,
# optimistic tiles, ambient idle — and docs/00-panel-guide.md for the
# reasoning behind all of it.
#
# If you already have a working Indicator config, do not use this file: copy
# the `substitutions:` block and the `packages:` line into yours instead, and
# paste main-page-tile.snippet.yaml into your own main page.
#
# FIRST FLASH IS OVER USB-C. After that it is OTA.
#
# ⚠️ Read docs/LIMITATIONS.md before you flash anything. In particular: this
#    assembly has never been through a compiler in this exact form, and a
#    clean compile would not prove much anyway — the panel is perfectly capable
#    of building successfully and then showing you a blank screen.
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  device_name: sensecap-panel
  friendly_name: SenseCAP Panel

  # ── HOME ASSISTANT ENTITY IDS ──────────────────────────────────────────────
  #
  # THESE ARE PLACEHOLDERS AND NONE OF THEM EXIST ON YOUR SYSTEM. Every one was
  # an entity in the author's house; the names have been replaced so the config
  # cannot accidentally reference a real device that is not yours.
  #
  # The pet's own entities (input_number.pet_*, sensor.indicator_pet, and so on)
  # are NOT here, because homeassistant/packages/desk_pet.yaml creates them with
  # fixed names. Only the ones that depend on YOUR house appear below.
  #
  # ALL OF THESE ARE OPTIONAL. Every use is guarded by `has_state()`. Point one
  # at something that does not exist and the feature it drives goes quiet; the
  # pet still hatches, still levels, still plays. Start by leaving them alone,
  # get the pet running, then wire them up one at a time.

  # A text sensor reporting meeting state, in `key=value;` form, containing
  # `call=1` while you are in a call. Anything that can say "I am busy" works.
  entity_meeting_state:    sensor.CHANGE_ME_meeting_state
  # A text sensor whose state is "PowerOn" when your monitor is awake.
  entity_monitor_power:    sensor.CHANGE_ME_monitor_power
  # Fetch (the level-6 power) reads these to decide what is shouting loudest.
  entity_agent_attention:  sensor.CHANGE_ME_agent_attention_count
  entity_mail_state:       sensor.CHANGE_ME_mail_state

  # ⚠️ THESE FOUR ARE NOT THE WHOLE SET. Home Assistant has no substitution
  #    mechanism, so the HA package cannot use `${...}` and carries literal
  #    `CHANGE_ME_` entity ids instead — about thirteen of them, for the decay
  #    pause gates and the four powers. Filling in the block above does NOT
  #    fill those in.
  #
  #    After you install the package: grep `homeassistant/packages/desk_pet.yaml`
  #    for `CHANGE_ME` and deal with every hit. Where a name appears in both
  #    places it is spelled identically, so you can copy across.

  # ── ESPHOME BASICS ─────────────────────────────────────────────────────────

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # NOTE: `desk_pet_helpers.h` is included by desk-pet.pkg.yaml, not here.
  # Declaring it in both places is a duplicate include.

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  # ESPHome 2026.7 made the native ESP-IDF toolchain the default. This display
  # build stays on the PlatformIO backend; the runtime framework is still
  # ESP-IDF. If your build breaks on a newer ESPHome, this line is the first
  # thing to try removing.
  toolchain: platformio
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

# Octal PSRAM is not optional here. The sprites, the LVGL buffers and the
# sudoku board do not fit without it.
psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0
  level: INFO

api:
  encryption:
    key: !secret panel_api_key
  # HA pushes values; a slow-moving entity may not push again for hours, so
  # after a reboot the labels sit on their placeholder text. Measured on the
  # author's panel: in the 14 s after boot, exactly one subscription received a
  # value. Asking HA to re-emit on connect closes that gap.
  on_client_connected:
    - delay: 5s
    - homeassistant.action:
        action: homeassistant.update_entity
        data:
          entity_id: >-
            sensor.indicator_pet,
            sensor.indicator_pet_settings,
            sensor.indicator_pet_mood
  # ⚠️ AFTER ADOPTING THE DEVICE IN HA, open its device page and enable
  #    "Allow the device to perform Home Assistant actions". Every button on
  #    the pet page silently does nothing without it, and nothing anywhere
  #    tells you why.

ota:
  - platform: esphome
    password: !secret panel_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # First-boot provisioning: connect to this AP and open http://192.168.4.1
  ap:
    ssid: "${device_name} Fallback"

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

i2c:
  - id: bus_a
    sda: GPIO39
    scl: GPIO40
    scan: false

spi:
  - id: lcd_spi
    clk_pin: GPIO41
    mosi_pin: GPIO48
    miso_pin: GPIO47

pca9554:
  - id: pca9554a_device
    address: 0x20
    pin_count: 16

output:
  - platform: ledc
    pin:
      number: GPIO45
      ignore_strapping_warning: true
    id: ledc_gpio45
    frequency: 100Hz

light:
  - platform: monochromatic
    name: "Backlight"
    id: backlight
    output: ledc_gpio45
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

display:
  # Pre-canned hardware profile, ESPHome 2026.7+. If your build predates the
  # mipi_rgb platform, swap in the longhand ST7701S block from
  # https://devices.esphome.io/devices/seeed-sensecap/
  - platform: mipi_rgb
    model: SEEED-INDICATOR-D1
    id: sensecap_display

touchscreen:
  platform: ft5x06
  id: sensecap_touchscreen
  transform:
    mirror_x: true
    mirror_y: true
  on_release:
    # The pet earns XP from panel use, counted at the one place every touch
    # passes through. Gated on `pet_game_active` because a round of Catch is
    # ~20 taps in 12 seconds, and letting those count would be a farm that
    # walks straight around the games cap.
    - lambda: |-
        if (!id(pet_game_active)) id(panel_touches) += 1;
    - if:
        condition: lvgl.is_paused
        then:
          - lvgl.resume:
          - lvgl.widget.redraw:
          - light.turn_on: backlight

# NOTE: `panel_touches` and `nav_idx` are declared in desk-pet.pkg.yaml.
# Do not declare them here as well; ESPHome rejects a duplicate id.

interval:
  - interval: 30s
    then:
      - script.execute: refresh_pet
  - interval: 700ms
    then:
      - if:
          condition:
            lambda: 'return id(pet_page_active);'
          then:
            - script.execute: pet_bob
  - interval: 80ms
    then:
      - if:
          condition:
            lambda: 'return id(pw_running);'
          then:
            - script.execute: pw_tick
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(pet_game_active) && id(pet_game_which) == 1;'
          then:
            - script.execute: pet_game_tick
      - if:
          condition:
            lambda: 'return id(pet_game_active) && id(pet_game_which) == 3;'
          then:
            - script.execute: spot_tick

lvgl:
  displays:
    - sensecap_display
  touchscreens:
    - sensecap_touchscreen
  bg_color: 0x14161A
  text_color: 0xE8EAED
  text_font: montserrat_20
  theme:
    button:
      pressed:
        opa: 80%

  style_definitions:
    - id: tile
      bg_color: 0x1E2228
      bg_opa: COVER
      radius: 14
      border_width: 1
      border_color: 0x2A2F37
      pad_all: 10
      text_font: montserrat_18
      # ⚠️ DO NOT DELETE THIS LINE. Dark text on a dark tile is invisible, and
      # that is exactly what happened. The top-level `text_color` above applies
      # to the screen; LVGL's default theme then re-asserts a dark text colour
      # on plain `obj` containers, so any label inside a styled container that
      # does not name its own colour renders black-on-black. Button labels are
      # unaffected, which is why some pages looked fine while others looked
      # like the data was missing. The text and the data were there the whole
      # time.
      text_color: 0xE8EAED

  pages:
    # Your own main page. The pet tile snippet goes in here.
    - id: page_main
      widgets:
        - label:
            align: TOP_MID
            y: 20
            text: "Panel"
            text_font: montserrat_28
        # ── PASTE main-page-tile.snippet.yaml HERE ─────────────────────────
        # It defines btn_pet_tile, bar_tile_hunger, bar_tile_spirit,
        # ico_pet_egg, ico_pet_hatch and lbl_pet_tile — all of which
        # `refresh_pet` paints. Without them the build will not compile.

packages:
  desk_pet: !include desk-pet.pkg.yaml
